<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>关注列表</title>
<style>
  /* ==========================================================================
   * 关注列表弹窗 · 设计系统 v2.0
   * 与日历主体共享同一套 Token，保证它是"同一件产品的另一个窗口"。
   * ========================================================================== */

  /* ============================ L1 基础层 ============================ */
  :root {
    --ink-900: #14181f;
    --ink-800: #1f2430;
    --ink-700: #333a48;
    --ink-600: #4b5563;
    --ink-500: #6b7280;
    --ink-400: #9aa1ad;
    --ink-300: #c2c8d2;
    --ink-200: #e2e6ec;
    --ink-100: #f0f2f5;
    --ink-50:  #f7f8fa;
    --ink-25:  #fcfbf9;

    --blue-50:  #eff4fc;
    --blue-100: #dae6fa;
    --blue-200: #b9cff5;
    --blue-300: #8fb0ec;
    --blue-400: #6389df;
    --blue-500: #3b6fd4;
    --blue-600: #1976d2;
    --blue-700: #155ba6;
    --blue-800: #10457e;
    --blue-900: #0c3056;

    --red-50:  #fdf0ef;
    --red-100: #fbdcd9;
    --red-300: #ee9187;
    --red-400: #e46659;
    --red-500: #d6453f;
    --red-600: #bf3330;
    --red-700: #9a2826;

    --fs-3xs: 8px;
    --fs-2xs: 9px;
    --fs-xs:  10px;
    --fs-sm:  11px;
    --fs-md:  13px;
    --fs-lg:  14px;
    --fs-xl:  15px;

    --fw-regular: 400;
    --fw-medium:  500;
    --fw-semibold: 600;
    --fw-bold:    700;

    --font-sans: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI",
                 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
                 "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    --font-num-feat: "tnum" 1, "lnum" 1, "ss01" 1;

    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px;
    --s-8: 32px;   /* 与 template.html 同一套间距阶（空态 #empty 用到，缺省会令整条 padding 失效） */

    --r-xs: 4px;
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 14px;
    --r-xl: 24px;
    --r-pill: 999px;

    --dur-instant: 80ms;
    --dur-fast:    140ms;
    --dur-normal:  220ms;
    --dur-slow:    340ms;
    --ease-out:    cubic-bezier(.22, .61, .36, 1);
    --ease-in-out: cubic-bezier(.4, 0, .2, 1);

    /* ========== L2 语义层 · 白日 ========== */
    --paper: #fdfcfa;
    --paper-edge: rgba(31, 35, 48, 0.10);
    --paper-hi: rgba(255, 255, 255, 0.72);
    --ink: var(--ink-800);
    --ink-soft: var(--ink-500);
    --ink-faint: var(--ink-400);
    --accent: var(--blue-500);
    --accent-soft: rgba(59, 111, 212, 0.12);
    --accent-ink: var(--blue-700);
    --danger: var(--red-600);
    --danger-soft: rgba(220, 38, 38, 0.12);
    --head-bg: rgba(31, 35, 48, 0.045);
    --col-bg: rgba(31, 35, 48, 0.022);
    --row-line: rgba(31, 35, 48, 0.065);
    --row-hover: rgba(31, 35, 48, 0.038);
    --ctl-hover: rgba(31, 35, 48, 0.10);

    --e-3: 0 12px 32px rgba(31, 35, 48, 0.20), 0 3px 10px rgba(31, 35, 48, 0.10),
           inset 0 1px 0 var(--paper-hi);
  }

  /* ========== L2 语义层 · 黑夜 ========== */
  html[data-theme="dark"] {
    --paper: #1e222e;
    --paper-edge: rgba(255, 255, 255, 0.09);
    --paper-hi: rgba(255, 255, 255, 0.05);
    --ink: #e8eaf0;
    --ink-soft: #9aa3b3;
    --ink-faint: #6a7283;
    --accent: #6b9bff;
    --accent-soft: rgba(107, 155, 255, 0.18);
    --accent-ink: #a8c4ff;
    --danger: #f08b86;
    --danger-soft: rgba(240, 139, 134, 0.16);
    --ink-300: #3b4254;
    --head-bg: rgba(255, 255, 255, 0.055);
    --col-bg: rgba(255, 255, 255, 0.028);
    --row-line: rgba(255, 255, 255, 0.055);
    --row-hover: rgba(255, 255, 255, 0.05);
    --ctl-hover: rgba(255, 255, 255, 0.12);

    --e-3: 0 16px 40px rgba(0, 0, 0, 0.60), 0 4px 12px rgba(0, 0, 0, 0.38),
           inset 0 1px 0 var(--paper-hi);
  }

  /* ============================ L3 组件层 ============================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: transparent;
    font-family: var(--font-sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 不透明卡片容器：窗口 transparent:true，容器内不透明，规避 Windows 透明背景渲黑块 */
  #card {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: var(--r-lg);
    box-shadow: var(--e-3);
    overflow: hidden;
  }

  /* 标题栏 = 原生拖动把手（-webkit-app-region: drag，系统级拖动，不受范围限制） */
  #header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px var(--s-2) 11px var(--s-4);
    background: var(--head-bg);
    border-bottom: 1px solid var(--row-line);
    -webkit-app-region: drag;
    user-select: none; -webkit-user-select: none;
    cursor: move;
  }
  #header:active { cursor: grabbing; }
  .title { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-md); font-weight: var(--fw-bold); letter-spacing: 0.2px; }
  .title-icon { flex: 0 0 auto; color: var(--accent); display: block; }
  .count {
    font-size: var(--fs-xs); font-weight: var(--fw-bold);
    background: var(--accent-soft); color: var(--accent-ink);
    padding: 2px var(--s-2); border-radius: var(--r-pill);
    font-variant-numeric: tabular-nums; font-feature-settings: var(--font-num-feat);
  }
  #close {
    width: 24px; height: 24px; border: none; cursor: pointer;
    background: transparent; color: var(--ink-faint); font-size: var(--fs-md); line-height: 1;
    border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    -webkit-app-region: no-drag;   /* 按钮必须排除，否则点不动 */
    transition: background var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out);
  }
  #close:hover { background: var(--ctl-hover); color: var(--ink); }

  /* 列头 */
  #cols {
    flex: 0 0 auto;
    display: grid; grid-template-columns: 62px 1fr 56px 24px; gap: var(--s-2);
    padding: 7px var(--s-4);
    border-bottom: 1px solid var(--row-line);
    background: var(--col-bg);
    font-size: var(--fs-xs); font-weight: var(--fw-bold);
    color: var(--ink-faint); letter-spacing: 0.4px;
  }
  #body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 3px 0; }

  .row {
    display: grid; grid-template-columns: 62px 1fr 56px 24px; gap: var(--s-2);
    align-items: center;
    padding: var(--s-2) var(--s-4);
    border-bottom: 1px solid var(--row-line);
    transition: background var(--dur-fast) var(--ease-out);
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--row-hover); }

  .rl-date {
    font-size: var(--fs-sm); font-weight: var(--fw-bold); white-space: nowrap;
    cursor: pointer; color: var(--ink);
    font-variant-numeric: tabular-nums; font-feature-settings: var(--font-num-feat);
    -webkit-app-region: no-drag;
    transition: color var(--dur-fast) var(--ease-out);
  }
  .rl-date:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

  /* 内容列：v3.0.0 改为省略号截断（原横向拖动已移除）—— 长内容不再撑破网格，✕ 恒在最后一列。
   * min-width:0 是关键：grid 轨道默认 min-width:auto 会被超长内容撑开、把 ✕ 挤出可视区。 */
  .rl-text-wrap {
    min-width: 0; overflow: hidden;
    -webkit-app-region: no-drag;
  }
  .rl-text {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--ink-soft);
  }

  /* 定时列（v3.1.0 契约 C6）：从内容文本拆出的独立单元格，位于「内容」与「删除」之间。
   * 有时间 → HH:MM；无时间 → 全天。fixed 56px 轨道 + nowrap，保证两者都不折行、不挤内容列。 */
  .rl-time {
    font-size: var(--fs-sm); font-weight: var(--fw-semibold);
    white-space: nowrap; text-align: center;
    font-variant-numeric: tabular-nums; font-feature-settings: var(--font-num-feat);
    color: var(--accent-ink);
    -webkit-app-region: no-drag;
  }
  /* 全天态弱化，避免与真正的定时时刻抢视线 */
  .rl-time.is-allday { color: var(--ink-faint); font-weight: var(--fw-medium); }

  .rl-del {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer;
    background: transparent; color: var(--ink-faint);
    border-radius: var(--r-sm); font-size: var(--fs-sm);
    -webkit-app-region: no-drag;
    transition: background var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out);
  }
  .rl-del:hover { background: var(--danger-soft); color: var(--danger); }

  /* ========== 录入区（v3.1.0 契约 C7）：常驻底部、可折叠 ==========
   * 选择「可折叠」而非「常驻全展开」的理由：窗口仅 340px 宽、440px 高，5 个字段 +
   * 按钮若常驻会吃掉约 1/4 高度、持续挤压列表。收起时仅占一行（30px，不挤压列表），
   * 展开时表单插入列表下方，由 #body 的 flex:1 / min-height:0 自动吸收高度变化。
   * 整块设 -webkit-app-region:no-drag —— 本区不在 #header 拖动区内，此处为防御性声明。 */
  #addbar {
    flex: 0 0 auto;
    border-top: 1px solid var(--row-line);
    background: var(--col-bg);
    -webkit-app-region: no-drag;
  }
  #addToggle {
    width: 100%; height: 30px; border: none; cursor: pointer;
    background: transparent; color: var(--ink-soft);
    font-family: var(--font-sans); font-size: var(--fs-sm); font-weight: var(--fw-medium);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-app-region: no-drag;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  #addToggle:hover { background: var(--row-hover); color: var(--accent); }
  #addToggle .plus { font-size: var(--fs-md); line-height: 1; }
  #addToggle .caret { font-size: var(--fs-2xs); transition: transform var(--dur-fast) var(--ease-out); }
  #addbar.open #addToggle .caret { transform: rotate(180deg); }

  #addForm { padding: 2px var(--s-4) var(--s-3); }
  #addForm[hidden] { display: none; }
  .add-line { display: flex; align-items: center; gap: 6px; }
  .add-line + .add-line { margin-top: 6px; }
  .af-lbl { flex: 0 0 auto; font-size: var(--fs-xs); color: var(--ink-faint); white-space: nowrap; }
  .af-sep { flex: 0 0 auto; font-size: var(--fs-xs); color: var(--ink-faint); }

  .af-num, .af-text {
    font-family: var(--font-sans); font-size: var(--fs-sm);
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--paper-edge); border-radius: var(--r-sm);
    padding: 0 6px; height: 26px;
    font-variant-numeric: tabular-nums; font-feature-settings: var(--font-num-feat);
    -webkit-app-region: no-drag;
    transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .af-num:focus, .af-text:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  /* 去掉数字输入框的上下箭头：56px 宽的窄格里箭头会把数字挤没 */
  .af-num::-webkit-outer-spin-button, .af-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .af-y  { width: 48px; }
  .af-md { width: 38px; }
  .af-hm { width: 40px; }
  .af-text { flex: 1 1 auto; min-width: 0; }

  #addSubmit {
    flex: 0 0 auto; height: 26px; padding: 0 var(--s-3);
    border: none; border-radius: var(--r-sm); cursor: pointer;
    background: var(--accent); color: #fff;
    font-family: var(--font-sans); font-size: var(--fs-sm); font-weight: var(--fw-semibold);
    -webkit-app-region: no-drag;
    transition: filter var(--dur-fast) var(--ease-out);
  }
  html[data-theme="dark"] #addSubmit { color: #0b1220; }   /* 深底下的亮蓝配浅字对比不足，改用深字 */
  #addSubmit:hover { filter: brightness(1.08); }
  #addSubmit:active { filter: brightness(0.94); }
  #addSubmit:disabled { cursor: default; opacity: 0.6; filter: none; }

  /* 轻提示（覆盖层，不占布局）：固定悬浮在录入区上方 */
  #toast {
    position: absolute; left: 50%; bottom: 40px;
    transform: translateX(-50%) translateY(6px);
    max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: var(--ink-800); color: #fff;
    font-size: var(--fs-xs); padding: 5px var(--s-3); border-radius: var(--r-pill);
    box-shadow: var(--e-3);
    opacity: 0; pointer-events: none;
    -webkit-app-region: no-drag;
    transition: opacity var(--dur-normal) var(--ease-out), transform var(--dur-normal) var(--ease-out);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  html[data-theme="dark"] #toast { background: var(--ink-100); color: var(--ink-900); }

  /* 空态：用 CSS 伪元素画「虚线圆 + 加号」徽标（不动 JS 生成的 DOM） */
  #empty { padding: var(--s-8) var(--s-5); text-align: center; color: var(--ink-faint); font-size: var(--fs-sm); }
  #empty::before {
    content: '+';
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; margin: 0 auto var(--s-3);
    border: 1.5px dashed var(--ink-300); border-radius: 50%;
    font-size: 19px; font-weight: var(--fw-regular); line-height: 1;
    color: var(--ink-faint);
  }
  #empty .hint { margin-top: 7px; font-size: var(--fs-xs); opacity: 0.75; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.16); border-radius: var(--r-pill); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.26); }
  html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); }
  html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }

</style>
</head>
<body>
  <div id="card">
    <div id="header">
      <span class="title"><svg class="title-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5 Q4 4.5 5 4.5 Q9.5 4.5 12 6.8 Q14.5 4.5 19 4.5 Q20 4.5 20 5.5 L20 18.5 Q20 19.5 19 19.5 Q14.5 19.5 12 17.2 Q9.5 19.5 5 19.5 Q4 19.5 4 18.5 Z"/><path d="M12 6.8 L12 17.2"/></svg>关注列表 <span class="count" id="count">0</span></span>
      <button id="close" title="关闭">✕</button>
    </div>
    <div id="cols"><div>日期</div><div>关注内容</div><div>定时</div><div></div></div>
    <div id="body"></div>
    <div id="addbar">
      <button id="addToggle" title="在此窗口直接录入特别关注"><span class="plus">＋</span>新增关注<span class="caret">▲</span></button>
      <div id="addForm" hidden>
        <div class="add-line">
          <span class="af-lbl">日期</span>
          <input id="afY" class="af-num af-y" type="number" min="1900" max="3000" step="1" title="年" aria-label="年">
          <span class="af-sep">年</span>
          <input id="afM" class="af-num af-md" type="number" min="1" max="12" step="1" title="月" aria-label="月">
          <span class="af-sep">月</span>
          <input id="afD" class="af-num af-md" type="number" min="1" max="31" step="1" title="日" aria-label="日">
          <span class="af-sep">日</span>
          <span class="af-lbl" style="margin-left:auto;">定时</span>
          <input id="afH" class="af-num af-hm" type="number" min="0" max="23" step="1" title="时（留空 = 全天）" aria-label="时">
          <span class="af-sep">:</span>
          <input id="afMin" class="af-num af-hm" type="number" min="0" max="59" step="1" title="分（留空 = 全天）" aria-label="分">
        </div>
        <div class="add-line">
          <input id="afText" class="af-text" type="text" maxlength="15" placeholder="关注内容（≤15 字）" aria-label="关注内容">
          <button id="addSubmit">添加</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
  </div>

<script>
  (function () {
    var bodyEl = document.getElementById('body');
    var countEl = document.getElementById('count');

    // ---------- 数据 ----------
    var payload = {};
    try {
      payload = JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get('data') || '{}'));
    } catch (e) { payload = {}; }

    function applyTheme(mode) {
      if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
    }
    applyTheme(payload.theme);

    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    function render(list) {
      list = list || [];
      countEl.textContent = String(list.length);

      // 按日期升序（同日内再按定时 时:分 升序；无定时的全天提醒排最前）
      list = list.slice().sort(function (a, b) {
        var da = a.y * 10000 + a.m * 100 + a.d;
        var db = b.y * 10000 + b.m * 100 + b.d;
        if (da !== db) return da - db;
        var ta = (a.hh == null || a.mm == null) ? -1 : (a.hh * 100 + a.mm);
        var tb = (b.hh == null || b.mm == null) ? -1 : (b.hh * 100 + b.mm);
        return ta - tb;
      });

      bodyEl.innerHTML = '';
      if (!list.length) {
        var empty = document.createElement('div');
        empty.id = 'empty';
        empty.innerHTML = '<div>还没有任何特别关注</div><div class="hint">右键日历上的任意日期，即可添加</div>';
        bodyEl.appendChild(empty);
        return;
      }

      list.forEach(function (r) {
        var row = document.createElement('div');
        row.className = 'row';

        var dateEl = document.createElement('div');
        dateEl.className = 'rl-date';
        dateEl.textContent = r.m + '/' + pad2(r.d);
        dateEl.title = r.y + '/' + pad2(r.m) + '/' + pad2(r.d) + '（点击跳转）';
        dateEl.addEventListener('click', function () {
          if (window.api && window.api.remindlistGoto) {
            window.api.remindlistGoto(r.y, r.m, r.d);
          }
        });

        var wrap = document.createElement('div');
        wrap.className = 'rl-text-wrap';
        var txt = document.createElement('div');
        txt.className = 'rl-text';
        // v3.1.0（契约 C6）：定时已拆成独立列，内容文本不再拼接 ' · HH:MM'
        txt.textContent = r.text || '';
        txt.title = r.text || '';
        wrap.appendChild(txt);

        // v3.1.0（契约 C6）：独立「定时」单元格，插在内容之后、删除之前。
        // 有时间 → HH:MM（补零）；无时间（hh/mm 任一为 null/缺失，含旧记录）→ 全天。
        var hasTime = (r.hh != null && r.mm != null);
        var timeEl = document.createElement('div');
        timeEl.className = hasTime ? 'rl-time' : 'rl-time is-allday';
        timeEl.textContent = hasTime ? (pad2(r.hh) + ':' + pad2(r.mm)) : '全天';
        timeEl.title = hasTime
          ? ('定时提醒：' + r.hh + '时' + r.mm + '分')   // 与 app.js 提示同口径：无空格
          : '全天提醒';
        timeEl.setAttribute('aria-label', timeEl.textContent);

        var del = document.createElement('button');
        del.className = 'rl-del';
        del.textContent = '✕';
        del.title = '取消关注';
        del.addEventListener('click', function () {
          if (window.api && window.api.remindlistRemove) window.api.remindlistRemove(r.id);
        });

        row.appendChild(dateEl);
        row.appendChild(wrap);
        row.appendChild(timeEl);
        row.appendChild(del);
        bodyEl.appendChild(row);
      });
    }

    // v3.0.0：内容列改为省略号截断（见 .rl-text），原「横向拖动看长文」已移除 ——
    // 完整文本仍可通过 title 悬停查看。
    render(payload.reminders);

    // ---------- 录入区（v3.1.0 契约 C7）：在本窗口直接录入特别关注 ----------
    // 提交走 window.api.addReminder({y,m,d,hh,mm,text})。成功后主进程会 broadcastReminders()，
    // 它已覆盖「主窗 reminders-changed」+「本列表窗 remindlist-data」两条同步链路 —— 因此这里
    // 不手动 render，列表刷新由 onRemindlistData 回调统一完成（见文件末尾）。
    var addbar = document.getElementById('addbar');
    var addToggle = document.getElementById('addToggle');
    var addForm = document.getElementById('addForm');
    var inY = document.getElementById('afY');
    var inMo = document.getElementById('afM');
    var inD = document.getElementById('afD');
    var inH = document.getElementById('afH');
    var inMi = document.getElementById('afMin');
    var inText = document.getElementById('afText');
    var addSubmit = document.getElementById('addSubmit');
    var toastEl = document.getElementById('toast');

    // 日期默认今天；提交成功后只清空内容与时分、保留日期（用户常需连续录入同一天多条）
    var now = new Date();
    inY.value = String(now.getFullYear());
    inMo.value = String(now.getMonth() + 1);
    inD.value = String(now.getDate());

    var toastTimer = null;
    function showToast(msg) {
      if (!toastEl) return;
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
    }

    function setFormOpen(open) {
      if (open) {
        addbar.classList.add('open');
        addForm.hidden = false;
        try { inText.focus(); } catch (e) {}
      } else {
        addbar.classList.remove('open');
        addForm.hidden = true;
      }
    }
    addToggle.addEventListener('click', function () { setFormOpen(!!addForm.hidden); });

    // 输入一个 input 的整数；空串 → null（= 全天或未填）
    function readInt(el) {
      var v = String(el.value || '').trim();
      if (v === '') return null;
      var n = parseInt(v, 10);
      return isFinite(n) ? n : null;
    }

    function submitReminder() {
      if (!window.api || !window.api.addReminder) { showToast('当前环境不支持添加'); return; }
      var text = String(inText.value || '').trim();
      if (!text) { showToast('请先填写关注内容'); try { inText.focus(); } catch (e) {} return; }
      if (text.length > 15) text = text.slice(0, 15);   // 与主进程 MAX_REMINDER_TEXT=15 保持一致

      var y = readInt(inY), m = readInt(inMo), d = readInt(inD);
      if (y === null || y < 1900 || y > 3000) { showToast('年份需为 1900~3000'); return; }
      if (m === null || m < 1 || m > 12) { showToast('月份需为 1~12'); return; }
      if (d === null || d < 1 || d > 31) { showToast('日期需为 1~31'); return; }

      var hh = readInt(inH), mm = readInt(inMi);
      // 时/分可留空 = 全天；只填其一时同样按全天（与主进程「成对」归一一致），避免歧义
      if (hh !== null && (hh < 0 || hh > 23)) { showToast('小时需为 0~23'); try { inH.focus(); } catch (e) {} return; }
      if (mm !== null && (mm < 0 || mm > 59)) { showToast('分钟需为 0~59'); try { inMi.focus(); } catch (e) {} return; }

      var payload = { y: y, m: m, d: d, text: text };
      if (hh !== null && mm !== null) { payload.hh = hh; payload.mm = mm; }   // 缺省即全天（成对才生效）

      addSubmit.disabled = true;
      Promise.resolve(window.api.addReminder(payload)).then(function (r) {
        addSubmit.disabled = false;
        if (!r) { showToast('添加失败，请检查输入'); return; }
        inText.value = '';
        inH.value = '';
        inMi.value = '';
        showToast('已添加  ' + r.m + '/' + pad2(r.d) +
          (r.hh != null ? (' ' + pad2(r.hh) + ':' + pad2(r.mm)) : ' 全天'));
        try { inText.focus(); } catch (e) {}
      }).catch(function () {
        addSubmit.disabled = false;
        showToast('添加失败，请重试');
      });
    }

    addSubmit.addEventListener('click', submitReminder);
    addForm.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submitReminder(); }
    });

    // ---------- 关闭 ----------
    function close() {
      if (window.api && window.api.remindlistClose) window.api.remindlistClose();
      setTimeout(function () { try { window.close(); } catch (e) {} }, 80);
    }
    document.getElementById('close').addEventListener('click', close);
    // Escape 关闭；但焦点在录入表单内时不关（避免误触丢失正在输入的内容）—— 该守卫只为
    // 新增输入框而设，不改变「无输入时 Escape 关闭窗口」的既有行为。
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      var t = e.target;
      if (t && (t.closest ? t.closest('#addForm') : false)) return;
      close();
    });

    // ---------- 主进程推送更新 ----------
    if (window.api && window.api.onRemindlistData) {
      window.api.onRemindlistData(function (data) {
        if (!data) return;
        if (data.theme) applyTheme(data.theme);
        render(data.reminders);
      });
    }
    // 主题切换实时跟随（与主窗一致）
    if (window.api && window.api.onThemeChanged) {
      window.api.onThemeChanged(function (mode) { applyTheme(mode); });
    }
  })();
</script>
</body>
</html>
