<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 任务栏部件：透明背景，仅绘制时间/日期文字，叠加在原生日历时钟同位置 */
  /* 部件不透明绘制任务栏同款底色（消除透明+亚克力混合导致的模糊零碎） */
  .theme-light { --tb-text: #1b1b1b; --tb-bg: #f3f3f3; }
  .theme-dark  { --tb-text: #f3f3f3; --tb-bg: #2b2b2b; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    background: var(--tb-bg);             /* 不透明：绘制任务栏底色，文字清晰不模糊 */
    overflow: hidden;
    cursor: pointer;
    color: var(--tb-text);
  }

  .clock-widget {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;   /* 上下整体居中 */
    gap: 1px; line-height: 1.15; user-select: none;
    position: relative;
  }
  .clock-widget .t, .clock-widget .d {
    font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums;             /* 等宽数字 */
    letter-spacing: .2px;
    white-space: nowrap;
  }
  /* 去掉 hover brightness 滤镜（会引起重绘模糊），仅轻微变色反馈 */
  .clock-widget:hover { opacity: .92; }

  /* 悬停提示：农历 + 星期（对应原生时钟悬停信息） */
  .tip {
    position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    margin-bottom: 6px; padding: 6px 10px; border-radius: 8px;
    background: rgba(40,40,45,.95); color: #fff; font-size: 12px; white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .clock-widget:hover .tip { opacity: 1; }

  /* 右键菜单（替换原系统托盘的打开/退出入口） */
  #tb-menu {
    position: absolute; bottom: 100%; right: 0; margin-bottom: 6px;
    min-width: 132px; padding: 5px; border-radius: 10px;
    background: rgba(38,40,46,.97); color: #f3f3f3; font-size: 12.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); backdrop-filter: blur(8px);
    display: none; z-index: 50; user-select: none;
  }
  #tb-menu .mi { padding: 8px 10px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  #tb-menu .mi:hover { background: rgba(255,255,255,.12); }
  #tb-menu .mi.danger { color: #ff8a82; }
  #tb-menu .sep { height: 1px; background: rgba(255,255,255,.12); margin: 4px 2px; }
</style>
</head>
<body class="theme-dark">
  <div class="clock-widget" id="cw">
    <div class="t" id="t">--:--</div>
    <div class="d" id="d">----/--/--</div>
    <div class="tip" id="tip"></div>
    <div id="tb-menu">
      <div class="mi" id="miOpen">📅 打开日历</div>
      <div class="sep"></div>
      <div class="mi danger" id="miExit">⏻ 退出软件</div>
    </div>
  </div>
  <script src="lunar.min.js"></script>
  <script src="widget.js"></script>
</body>
</html>
