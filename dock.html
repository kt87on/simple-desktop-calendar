<style>
  /* ==========================================================================
   * 悬浮插件条 · 设计系统 v2.0
   * --------------------------------------------------------------------------
   * 定位：桌面上的一枚「微型仪表」—— 垂直接近任务栏高度，横向 116px 紧凑双行。
   * 与日历主体共享同一套 Token（色板 / 字阶 / 圆角 / 阴影 / 动效），
   * 保证插件与弹出日历在视觉上是同一件产品的两个部分。
   *
   * ⚠️ 硬约束（勿改）：
   *   1) 卡片 inset 左上 2px、右下 0px —— 见下方 applyDockSize() 的注释，
   *      右下归零是 v1.7.22.4 修复「插件和任务栏之间有空白」的关键。
   *   2) 卡片阴影必须 y 偏移为 0（对称），否则底部投影会在插件与任务栏之间
   *      造出一条视觉缝隙，用户会反馈「没贴住」。
   * ========================================================================== */

  /* ============================ L1 基础层 ============================ */

    --ink-800: #1f2430;

    --ink-600: #4b5563;
    --ink-500: #6b7280;
    --ink-400: #9aa1ad;
    --ink-300: #c2c8d2;
    --ink-200: #e2e6ec;
    --ink-100: #f0f2f5;
    --ink-50:  #f7f8fa;
    --ink-25:  #fcfbf9;

    /* ---------- 色板：雅蓝 ---------- */
    --blue-50:  #eff4fc;
    --blue-100: #dae6fa;
    --blue-200: #b9cff5;
    --blue-300: #8fb0ec;
    --blue-400: #6389df;
    --blue-500: #3b6fd4;
    --blue-600: #1976d2;
    --blue-700: #155ba6;
    --blue-800: #10457e;
    --blue-900: #0c3056;

    /* ---------- 色板：朱砂 ---------- */
    --red-500: #d6453f;
    --red-600: #bf3330;

    /* ---------- 字阶（本页仅用 3 级） ---------- */
    --fs-3xs: 8px;

    --fs-xs:  10px;
    --fs-sm:  11px;
    --fs-md:  13px;
    --fs-lg:  14px;
    --fs-xl:  15px;
    --fs-2xl: 17px;   /* 挂件时钟 */
    --fs-6xl: 30px;

    --fw-regular: 400;
    --fw-medium:  500;
    --fw-semibold: 600;
    --fw-bold:    700;

    --font-sans: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI",
                 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
                 "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    --font-num-feat: "tnum" 1, "lnum" 1, "ss01" 1;

    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;

    --r-xs: 4px;
    --r-sm: 6px;
    --r-md: 10px;   /* 挂件卡片 */
    --r-lg: 14px;
    --r-xl: 24px;
    --r-pill: 999px;

    --dur-instant: 80ms;
    --dur-fast:    140ms;
    --dur-normal:  220ms;
    --ease-out:    cubic-bezier(.22, .61, .36, 1);
    --ease-in-out: cubic-bezier(.4, 0, .2, 1);

    /* ========== L2 语义层 · 白日 ========== */
    --card: rgba(250, 250, 252, 0.95);
    --card-hover: rgba(238, 242, 250, 0.97);
    --edge: rgba(31, 35, 48, 0.09);
    --hi: rgba(255, 255, 255, 0.85);          /* 顶部高光 */
    --ink: var(--ink-800);

    /* v2.4.0 第二轮 皮肤层（浮动插件独立 per-surface，不跟随日历） */

  /* ==========================================================================
   * v3.0.0 §7 六套「风格」token（风格驱动，叠加在 [data-theme] 之上）
   * --------------------------------------------------------------------------
   * 三轴解耦（§12）：data-theme=背景明暗、data-style=风格材质、data-text=文字轴。
   * 浅/深两档各自独立成块（[data-theme="light"|"dark"][data-style="X"]，同为 (0,2,0)
   * 互不越界）。变量按 dock 自己的体系落：--card/--card-hover/--edge/--hi/--ink/

  /* ---------- ① 默认（融合） ---------- */

  [data-theme="light"][data-style="glass"] {

  [data-theme="light"][data-style="warm"] {

  /* ==========================================================================
   * v3.0.0 §3.2 文字轴 data-text（只覆盖「文字相关」变量）
   * light=深字（浅底语义）、dark=浅字；auto/缺失 → 不设属性，跟随 [data-theme]。
   * :root[...] 特异性 (0,2,0)，置于全部 [data-style] 之后，与 [data-theme][data-style]
   * 同权靠源序取胜 → 文字轴恒压过风格档。仅动 --ink/--ink-soft/--stroke-color/--ink-glow。
   * ========================================================================== */
  :root[data-text="light"] {
    --ink: #1f2430; --ink-soft: #4b5563;
    --stroke-color: rgba(255, 255, 255, 0.70);
    --ink-glow: 0 0 0 transparent;
  }
  :root[data-text="dark"] {
    --ink: #e8eaf0; --ink-soft: #9aa3b3;
    --stroke-color: rgba(0, 0, 0, 0.55);
    --ink-glow: 0 0 0 transparent;
  }

  /* v2.4.0 第二轮 自选纯色/图片皮肤：只覆盖卡片 #card（窗口外透明区保持穿透，不改 body）。
   * 皮肤只改背景层，文字明暗由 data-theme 全量驱动；状态色/强调色仍取生效主题 token。 */
  /* v3.0.0：皮肤层规则一律加 html 前缀（特异性 (0,1,1)→(1,1,1)），避免被源序更后的
   * 同特异性主题/风格规则反压（与 template.html 四角黑边同一铁律，见 MEMORY.md 第二节）。 */
  html[data-skin="color"] #card { background: var(--skin-bg-solid); }
  /* v2.4.4 图片皮肤：#card 铺局部保护遮罩（透明底 + --protect-mid 罩层，提升文字对比）。 */
  html[data-skin="image"] #card { background: var(--protect-mid); }

  /* v2.4.4 自选纯色/图片皮肤：文字兜底极细描边 + 柔和光晕（由 dockApplyClarity 按明暗写入）。
   * 原生皮肤无 [data-skin]，不触发。 */
  html[data-skin="color"] #dockTime, html[data-skin="image"] #dockTime,
  html[data-skin="color"] #dockWeek, html[data-skin="image"] #dockWeek,
  html[data-skin="color"] #dockDateNum, html[data-skin="image"] #dockDateNum {
    -webkit-text-stroke: 0.5px var(--stroke-color);
    text-shadow: var(--ink-glow);
  }

  /* v2.4.2 修复「纯色/图片模式点击闪黑 + 方方正正 + 两层堆叠」：
   * 根因 1) 主进程把 dock 窗口 setBackgroundColor(不透明色) → 透明窗口退化成方形色块，
   *        圆角透明区/阴影失效，形成"底子+色块"两层；已在 electron-main.js bgColorFor 改为始终透明。
   * 根因 2) body.hit #card:hover 优先级高于 [data-skin]，hover 把自选背景换成 --card-hover
   *        （黑夜底子）→ 点击闪黑。
   * 因此不再单独剥离描边/阴影：纯色/图片复用原生模式的 --edge 描边 + --shadow 阴影 + 顶部高光
   * （圆角随 #card 不变），仅在 hover 时锁住自选背景，其余点按反馈与原生一致。
   * v3.0.0：修正选择器 —— data-skin 挂在 <html>（root.dataset.skin），原 `body.hit[data-skin=…]`
   * 要求 <body> 带该属性（永不成立，规则形同虚设）；改为 `html[data-skin=…] body.hit` 使其真正生效。 */
  html[data-skin="color"] body.hit #card:hover { background: var(--skin-bg-solid); }
  html[data-skin="image"] body.hit #card:hover { background: var(--protect-mid); }

  /* ============================ L3 组件层 ============================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-sans);
    background: transparent;
    -webkit-user-select: none; user-select: none;
    cursor: pointer;
    -webkit-font-smoothing: antialiased;
  }

  #card {
    position: absolute; z-index: 0;
    /* 初始占位，与 applyDockSize() 的 padL/T/R/B 保持一致（右下 0 让卡片贴死窗口边） */
    left: 2px; top: 2px; right: auto; bottom: auto;
    border-radius: var(--r-md);
    background: var(--card);
    /* v3.0.0 §7：模糊/饱和随风格档（--dock-blur/--dock-sat），缺省沿用原 10px/1.3 */
    -webkit-backdrop-filter: blur(var(--dock-blur, 10px)) saturate(var(--dock-sat, 1.3));
    backdrop-filter: blur(var(--dock-blur, 10px)) saturate(var(--dock-sat, 1.3));
    border: 1px solid var(--edge);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    transition: background var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                transform var(--dur-instant) var(--ease-out);
  }
  /* v2.4.0 第二轮 图片皮肤背景层：铺满 #card、位于内容之下（负 z-index 落入 #card stacking context）。
   * background-image/size/position 由 applySkinImage 按 crop+zoom 换算写入。 */
  #skinImg {
    position: absolute; inset: 0; z-index: -1;
    background-repeat: no-repeat;
    background-color: transparent;
    pointer-events: none;
  }
  /* hover 高亮只在「实际可点」（body.hit）时出现，与点击热区保持一致 ——
     鼠标停在方框外的透明区域时不给"这里能点"的错误暗示（此时点击穿透给下面窗口）。 */
  body.hit #card:hover {
    background: var(--card-hover);
    box-shadow: var(--shadow-hover);
    border-color: var(--accent-soft);
  }
  #card:active { transform: scale(0.965); }

  #dockTime {
    font-size: var(--fs-2xl); font-weight: var(--fw-bold); line-height: 1;
    letter-spacing: 0.3px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-feature-settings: var(--font-num-feat);
  }
  #dockDate {
    display: flex; align-items: center; justify-content: center;
    gap: 6px;              /* v2.4.0 A6：星期与日期间距放宽 */
    font-size: var(--fs-xs); font-weight: var(--fw-semibold); line-height: 1;
    letter-spacing: 0.4px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    font-feature-settings: var(--font-num-feat);
  }
  #dockDate span { display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }

</style>

  <script>
    (function () {
      'use strict';
      var timeEl = document.getElementById('dockTime');
      var dateEl = document.getElementById('dockDate');
      var weekEl = document.getElementById('dockWeek');
      var dateNumEl = document.getElementById('dockDateNum');
      var cardEl = document.getElementById('card');

      function pad2(n) { return n < 10 ? '0' + n : '' + n; }

      // v2.2.0 需求3：新增秒与星期几。宽度 116px 下"周X MM/DD"去掉年份更紧凑，
      // 风格（字号/颜色/字重/tabular-nums）沿用原 token 不变。
      // v2.4.0 A6：星期与日期拆成两个 span，gap 放宽、整体在卡片内垂直居中。
      var WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];

      var lastTimeText = '';
      var lastWeekText = '';
      var lastDateText = '';
      function tick() {
        var t = new Date();
        // 仅在内容变化时写 DOM（省 CPU 重绘）；时间含秒后每秒变化
        if (timeEl) {
          var txt = pad2(t.getHours()) + ':' + pad2(t.getMinutes()) + ':' + pad2(t.getSeconds());
          if (txt !== lastTimeText) { lastTimeText = txt; timeEl.textContent = txt; }
        }
        if (weekEl) {
          var wtxt = '周' + WEEK_CN[t.getDay()];
          if (wtxt !== lastWeekText) { lastWeekText = wtxt; weekEl.textContent = wtxt; }
        }
        if (dateNumEl) {
          var dtxt = pad2(t.getMonth() + 1) + '/' + pad2(t.getDate());
          if (dtxt !== lastDateText) { lastDateText = dtxt; dateNumEl.textContent = dtxt; }
        }
      }

      /* v1.7.19：固定像素布局 —— 绕开 Chromium viewport 错算导致的裁切。
       * ------------------------------------------------------------------
       * 症状：嵌入任务栏后（以及部分浮动态）时钟被裁成竖条、日期看不见。
       * 根因：transparent + 无边框窗口在 SetParent 之后，webContents 的内部 viewport
       *       会被错算成 ~16px（物理窗口其实是 40~56px）。CSS 的 height:100% 于是 = 16px，
       *       #card(inset:2px) 内容区只剩 12px，17px 的时钟 + 10px 的日期必然被切掉。
       * 旧解法（v1.7.16 / v1.7.18）：嵌入后 setSize 强制 resize 让 viewport 重算 ——
       *       但这会让 Chromium 直接 kill 渲染进程，反而制造崩溃循环，已废弃。
       * 新解法：主进程把「物理窗口真实宽高」经 dock-size 发过来，这里用固定 px 覆盖
       *       html / body / #card，不再依赖任何百分比高度。viewport 算错也照样按真实
       *       尺寸排布，内容完整显示，且不触碰窗口尺寸，不会引发崩溃。 */
      var sizeW = 116, sizeH = 50;        // 兜底默认值，IPC 到达后立即被真实值覆盖
      function applyDockSize() {
        if (!sizeW || !sizeH) return;
        var de = document.documentElement;
        de.style.width = sizeW + 'px';
        de.style.height = sizeH + 'px';
        document.body.style.width = sizeW + 'px';
        document.body.style.height = sizeH + 'px';
        /* v1.7.22.4 修复（"插件和任务栏中间有空白"）：右下两边的 inset 改为 0，
         * 让卡片底边/右边**贴死窗口边缘**。窗口贴任务栏时，卡片底边即任务栏顶，消除
         * 原 inset:2px 造成的 2px 缝隙（scale 1.5 下 ≈ 3 物理像素的"没吸附"感）。
         * 左上仍留 2px 给边框/阴影，右下不留 —— 阴影向右/向下被窗口边界裁掉即可接受。 */
        var padL = 2, padT = 2, padR = 0, padB = 0;
        cardEl.style.left = padL + 'px';
        cardEl.style.top = padT + 'px';
        cardEl.style.right = 'auto';
        cardEl.style.bottom = 'auto';
        cardEl.style.width = (sizeW - padL - padR) + 'px';
        cardEl.style.height = (sizeH - padT - padB) + 'px';
      }
      if (window.api && window.api.onDockSize) {
        window.api.onDockSize(function (s) {
          if (!s || !s.w || !s.h) return;
          sizeW = s.w; sizeH = s.h;
          applyDockSize();
        });
      }

      /* ===== v1.7.21 需求1：点击热区严格 = 插件可视的小方框（#card 矩形） =====
       * 症状：无边框 + transparent 窗口的点击热区是**整个窗口矩形**，而小方框比窗口小一圈
       *      （四周留 2px 给边框/阴影，圆角外面也是透明的），于是点方框下面的透明区域
       *      也会弹出日历 —— 用户反馈"点水平线及以下都能弹出"。
       * 做法（Electron 官方 click-through 模式）：
       *   窗口默认是「鼠标穿透」的 setIgnoreMouseEvents(true, { forward: true })，
       *   forward:true 保证穿透状态下 mousemove 仍然会送进页面。页面按坐标判定：
       *     在 #card 矩形内 → setIgnoreMouseEvents(false)，窗口收回响应（可点/可拖/可右键）
       *     在 #card 矩形外 → 保持穿透，事件直接落到下面的窗口，插件完全不拦截
       *   同理，插件被拖到屏幕中间时，方框外的"隐形区域"不再吃掉任何点击。 */
      var hitInside = false;      // 与窗口当前的 ignore 状态保持同步（false = 当前穿透中）
      var hitReported = false;    // 自检用：热区链路就绪只上报一次
      function isInCard(x, y) {
        if (!cardEl) return false;
        var r = cardEl.getBoundingClientRect();
        return x >= r.left && x < r.right && y >= r.top && y < r.bottom;
      }
      // force=true 时不走"状态没变就跳过"的短路（松手后必须强制复判一次）
      function updateHit(x, y, force) {
        if (dragging) return;                    // 拖动期间绝不切穿透，否则拖到卡片外会掉手
        var inside = isInCard(x, y);
        if (!force && inside === hitInside) return;
        hitInside = inside;
        // 同步给 CSS：只有真正能点的区域才给 hover 反馈
        document.body.classList.toggle('hit', inside);
        if (window.api && window.api.dockSetMouse) window.api.dockSetMouse(!inside);
        if (!hitReported && window.api && window.api.dockHitReady) {
          hitReported = true;      // 只报一次：证明穿透状态下 mousemove 确实 forward 进来了
          window.api.dockHitReady();
        }
      }

      /* v2.4.0 A4：右键原生菜单弹出期间收不到 mousemove/mouseleave → body.hit 残留。
       * contextmenu / 窗口 blur 时显式复位：清 hitInside、移除 body.hit、恢复鼠标穿透。 */
      function resetHit() {
        hitInside = false;
        document.body.classList.remove('hit');
        if (window.api && window.api.dockSetMouse) window.api.dockSetMouse(true);
      }

      /* v1.7.22.5 拖拽改写 —— 绝对定位，禁止累加漂移（详见下方注释）。
       * v1.7.17 需求5 + v1.7.21 需求3/6：按住拖动，落点受工作区限制，松手不吸附。
       *
       * ===== 历史 bug（v1.7.22.4 及之前） =====
       * 旧实现：dock.html 内部用 `dragStart = mousePos` 跟踪鼠标，每帧算 `dy = mouse - dragStart`
       * 再更新 dragStart，传给主进程 dx/dy；主进程做 `b.y + dy`（累加）。
       * 当窗口被 clampDockToWorkArea 夹紧时，主进程返回的窗口位置 ≠ dock.html 期望的位置，
       * dock.html 内部 dragStart 只跟踪鼠标、不感知窗口实际位置，下一次 mousedown 时的
       * dragStart 已经是远离窗口的鼠标屏幕坐标，dy 算出来是从那个"远点"起的相对量，
       * 累加到 clamp 后的窗口位置产生数据漂移 —— 表现为用户拖动 N 次后"底部边界逐渐上移"。
       *
       * ===== 新实现（按用户给的 WinForms 标准模板） =====
       *   1. mousedown：把当前鼠标屏幕坐标告诉主进程，主进程记下 `offset = mousePos - windowPos`
       *   2. mousemove：直接传当前鼠标屏幕坐标给主进程，主进程算 `newPos = mousePos - offset`
       *   3. 主进程实时获取 workArea，clampDockToWorkArea 后 setBounds
       * 整个 mousemove 期间窗口位置不参与 `+=` 计算，clamp 介入不影响下次计算结果。 */
      var dragging = false;
      var dragMoved = false;             // 已超 4px 阈值（区分 click vs drag）
      var dragDownX = 0, dragDownY = 0;  // mousedown 时的鼠标屏幕坐标（仅用于阈值判断）

      /* 统一收口：结束拖动 + 按当前坐标强制复判热区。
       * e 可为 null（兜底路径没有坐标）——此时按"不在卡片内"处理，先恢复穿透，
       * 等下一次 mousemove 再据实切回。 */
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        if (dragMoved && window.api && window.api.dockDragEnd) window.api.dockDragEnd();
        // 拖动期间 updateHit 全程被短路（防止拖到卡片外掉手），松手必须强制复判一次
        if (e && typeof e.clientX === 'number') updateHit(e.clientX, e.clientY, true);
        else updateHit(-1, -1, true);
      }

      document.addEventListener('mousedown', function (e) {
        if (e.button !== 0) return;                                   // 仅左键
        dragging = true;
        dragMoved = false;
        dragDownX = e.screenX;                                        // 仅做阈值判断，不参与位置计算
        dragDownY = e.screenY;
        /* 【v1.7.21 关键修复】捕获指针，保证拖到窗口外松手时 mouseup 仍能回到本窗口。
         * 不加这段的后果：光标移出窗口后窗口就收不到鼠标消息，mouseup 永远丢失，
         * dragging 卡死在 true → 之后鼠标一回到插件上就继续跟着走（粘鼠标），
         * 必须再点一次才解开。v1.7.20 曾用 pointercancel/失焦兜底，v1.7.21 重写时丢失。 */
        try {
          if (e.pointerId !== undefined && e.target && e.target.setPointerCapture) {
            e.target.setPointerCapture(e.pointerId);
          }
        } catch (err) {}
        // 【v1.7.22.5】通知主进程记录 mousedown 时的鼠标屏幕坐标（用于算 offset = mouse - window）
        try { if (window.api && window.api.dockDragStart) window.api.dockDragStart(e.screenX, e.screenY); } catch (err) {}
      });
      document.addEventListener('mousemove', function (e) {
        if (!dragging) { updateHit(e.clientX, e.clientY); return; }   // 未拖动 → 只做热区判定
        // 4px 阈值用于区分"点击"和"拖动"：阈值内静默，跨过阈值才算真正开始拖
        if (!dragMoved) {
          var dist = Math.abs(e.screenX - dragDownX) + Math.abs(e.screenY - dragDownY);
          if (dist < 4) return;
          dragMoved = true;
        }
        // 【v1.7.22.5】绝对定位：直接传当前鼠标屏幕坐标，不在 dock.html 这边算 dx/dy，
        // 主进程算 newPos = mousePos - offset（与累加的 b.y + dy 完全不同，零漂移）
        if (window.api && window.api.dockDragMove) window.api.dockDragMove(e.screenX, e.screenY);
      });
      document.addEventListener('mouseup', function (e) { endDrag(e); });
      // 兜底：指针捕获也没兜住时（切窗口、系统弹窗抢焦点等），失焦/取消一律收口
      window.addEventListener('blur', function () { endDrag(null); resetHit(); });
      document.addEventListener('pointercancel', function () { endDrag(null); });
      // 鼠标移出窗口 → 恢复穿透（避免窗口边缘残留的非透明热区）
      document.addEventListener('mouseleave', function () {
        if (dragging) return;
        resetHit();
      });

      // 左键：开 / 关日历主窗（拖动结束后松手的 click 不触发）
      document.addEventListener('click', function (e) {
        e.preventDefault();
        if (dragMoved) { dragMoved = false; return; }
        if (window.api && window.api.dockToggleMain) window.api.dockToggleMain();
      });
      // 右键：弹出托盘同款菜单（v2.4.0 A4：先复位热区，防原生菜单期间收不到事件导致残留）
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        resetHit();
        if (window.api && window.api.dockShowMenu) window.api.dockShowMenu();
      });
      /* v2.4.0 第二轮：浮动插件皮肤（独立 per-surface，不跟随日历）。
       * 主题由 skin-state.theme 驱动；背景层 color/image；GIF 隐藏时冻结切首帧快照。 */
      var dockSkin = null;
      var dockHidden = false;
      /* v2.4.4：取景布局纯函数（插件视口固定 116×50）。 */
      function dockLayoutSkin(el, IW, IH, crop, zoom) {
        if (!el) return;
        var vp = { w: 116, h: 50 };
        var c = crop || { x: 0, y: 0, w: 1, h: 1 };
        var z = (typeof zoom === 'number' && isFinite(zoom) && zoom > 0) ? zoom : 1;
        var iw = (typeof IW === 'number' && IW > 0) ? IW : vp.w;
        var ih = (typeof IH === 'number' && IH > 0) ? IH : vp.h;
        var cx = (c.x || 0) * iw, cy = (c.y || 0) * ih;
        var cw = (c.w || 0) * iw, ch = (c.h || 0) * ih;
        if (cw < 1) cw = 1; if (ch < 1) ch = 1;
        // 全图 cover 基准（crop.w/h 是 zoom 的派生冗余，不进基准；否则与反向 zoom=s/s0 不互逆）
        var s0 = Math.max(vp.w / iw, vp.h / ih);
        var s = s0 * z;
        var centerX = cx + cw / 2, centerY = cy + ch / 2;
        el.style.backgroundSize = (iw * s) + 'px ' + (ih * s) + 'px';
        el.style.backgroundPosition = (vp.w / 2 - centerX * s) + 'px ' + (vp.h / 2 - centerY * s) + 'px';
      }
      /* v2.4.4：图片真实显示尺寸缓存/探测（兜底 EXIF/WebP/老数据）；键即文件名。 */
      var dockImgRealSize = {};
      var dockImgProbing = {};
      function dockRealImageSize(file, cb) {
        if (dockImgRealSize[file]) { cb(dockImgRealSize[file]); return; }
        if (dockImgProbing[file]) { dockImgProbing[file].push(cb); return; }
        dockImgProbing[file] = [cb];
        var probe = new Image();
        probe.onload = function () {
          var sz = { w: probe.naturalWidth || 0, h: probe.naturalHeight || 0 };
          dockImgRealSize[file] = sz;
          var list = dockImgProbing[file]; delete dockImgProbing[file];
          for (var i = 0; i < list.length; i++) { try { list[i](sz); } catch (e) {} }
        };
        probe.onerror = function () {
          var list = dockImgProbing[file]; delete dockImgProbing[file];
          for (var i = 0; i < list.length; i++) { try { list[i](null); } catch (e) {} }
        };
        probe.src = 'skin://' + encodeURIComponent(file);
      }
      function dockApplyImage(image) {
        var el = document.getElementById('skinImg');
        if (!el) return;
        if (!image || !image.file) { el.style.backgroundImage = ''; el.style.opacity = ''; return; }
        var file = (dockHidden && image.snapshot) ? image.snapshot : image.file;
        el.style.backgroundImage = 'url("skin://' + encodeURIComponent(file) + '")';
        // v2.4.3 图片不透明度：直接写元素 style.opacity（走 CSS 变量继承在 Electron 下可能不生效）。
        el.style.opacity = (typeof image.opacity === 'number' && isFinite(image.opacity)) ? String(image.opacity) : '1';
        dockLayoutSkin(el, image.w, image.h, image.crop, image.zoom);   // 先用已知尺寸铺底
        // v2.4.4：异步用 Chromium 真实尺寸纠偏；不一致才重排一次。
        var enc = encodeURIComponent(file);
        dockRealImageSize(file, function (sz) {
          if (!sz || !sz.w || !sz.h) return;
          if (String(el.style.backgroundImage).indexOf(enc) < 0) return;
          var IW = (typeof image.w === 'number' && image.w > 0) ? image.w : sz.w;
          var IH = (typeof image.h === 'number' && image.h > 0) ? image.h : sz.h;
          if (sz.w !== IW || sz.h !== IH) dockLayoutSkin(el, sz.w, sz.h, image.crop, image.zoom);
        });
      }
      /* v3.0.0：三轴落地 —— data-style（风格材质）+ data-text（文字轴）。
       * data-text：'light'（深字）/'dark'（浅字）时写属性；'auto'/缺失 → 删除（跟随 data-theme）。
       * 只动根节点数据属性，绝不改 --card/--accent（那由 [data-theme]/[data-style] 负责）。 */
      function dockApplyTone(root, state) {
        if (state.style) root.dataset.style = state.style;
        else delete root.dataset.style;
        if (state.text === 'light' || state.text === 'dark') root.dataset.text = state.text;
        else delete root.dataset.text;
      }
      /* v3.0.0 §3.4：低对比兜底 —— warn=true 时 clarity 抬到 ≥35（保留用户选择，不反转） */
      function dockEffectiveClarity(state) {
        var c = (typeof state.clarity === 'number' && isFinite(state.clarity)) ? state.clarity : 0;
        if (state.warn === true && c < 35) c = 35;
        return c;
      }
      function dockApplySkin(state) {
        if (!state) return;
        var root = document.documentElement;
        var theme = (state.theme === 'dark') ? 'dark' : 'light';
        root.dataset.theme = theme;
        dockApplyTone(root, state);                       // v3.0.0：data-style / data-text
        var clarity = dockEffectiveClarity(state);        // v3.0.0：warn → 下限 35
        if (state.bg === 'color') {
          root.dataset.skin = 'color';
          root.style.setProperty('--skin-bg-solid', state.color || '#fafafc');
          dockApplyClarity(root, theme, clarity);
          var c0 = document.getElementById('skinImg');
          if (c0) { c0.style.backgroundImage = ''; c0.style.opacity = ''; }
        } else if (state.bg === 'image') {
          root.dataset.skin = 'image';
          root.style.removeProperty('--skin-bg-solid');
          dockApplyClarity(root, theme, clarity);
          dockApplyImage(state.image);
        } else {
          delete root.dataset.skin;
          root.style.removeProperty('--skin-bg-solid');
          dockClearReadability(root);
          var i1 = document.getElementById('skinImg');
          if (i1) { i1.style.backgroundImage = ''; i1.style.opacity = ''; }
        }
      }
      /* v2.4.4 自选皮肤：三层可读性变量（#card 保护遮罩 + 文字光晕 + 兜底描边），由 clarity 联动。 */
      function dockApplyClarity(root, theme, clarity) {
        if (!root) return;
        // v2.4.4：非法 clarity（'auto' / undefined / NaN / ±Infinity）一律按 0 处理（保护层归零），
        // 防止 NaN 落入 p>0 分支写出非法 CSS；合法数字输入零变化。
        if (typeof clarity !== 'number' || !isFinite(clarity)) clarity = 0;
        var p = Math.max(0, Math.min(1, (clarity || 0) / 100));
        var ink = (theme === 'dark') ? '0,0,0' : '255,255,255';
        // v2.4.4：clarity=0 → 保护层归零（不引入多余灰罩）；仅留主题兜底描边。
        if (p <= 0) {
          root.style.setProperty('--protect-mid', 'transparent');
          root.style.setProperty('--ink-glow', '0 0 0 transparent');
          var sa0 = (theme === 'dark') ? 0.55 : 0.70;
          root.style.setProperty('--stroke-color', 'rgba(' + ink + ',' + sa0.toFixed(3) + ')');
          return;
        }
        function a(base, k) { return (base + k * p).toFixed(3); }
        root.style.setProperty('--protect-mid', 'rgba(' + ink + ',' + a(0.03, 0.20) + ')');
        root.style.setProperty('--ink-glow', '0 0 ' + (1 + 3 * p).toFixed(1) + 'px rgba(' + ink + ',' + a(0.35, 0.35) + ')');
        var sa = (theme === 'dark') ? (0.55 - 0.25 * p) : (0.70 - 0.30 * p);
        root.style.setProperty('--stroke-color', 'rgba(' + ink + ',' + sa.toFixed(3) + ')');
      }
      function dockClearReadability(root) {
        if (!root) return;
        root.style.removeProperty('--protect-mid');
        root.style.removeProperty('--ink-glow');
        root.style.removeProperty('--stroke-color');
      }
      function dockSetFrozen(frozen) {
        frozen = !!frozen;
        if (dockHidden === frozen) return;
        dockHidden = frozen;
        if (dockSkin && dockSkin.bg === 'image' && dockSkin.image) dockApplyImage(dockSkin.image);
      }
      if (window.api && window.api.onSkinState) {
        window.api.onSkinState(function (state) {
          if (!state) return;
          dockSkin = state.dock || null;
          dockApplySkin(dockSkin);
        });
      }
      document.addEventListener('visibilitychange', function () {
        dockSetFrozen(document.hidden);
      });

      applyDockSize();      // v1.7.19：先用默认尺寸占位，IPC 到达后再校准为真实值
      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
