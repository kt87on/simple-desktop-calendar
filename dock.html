<title>任务栏挂件条</title>
<style>
  /* ==========================================================================
   * 悬浮插件条 · 设计系统 v2.0
   * --------------------------------------------------------------------------
   * 定位：桌面上的一枚「微型仪表」—— 垂直接近任务栏高度，横向 116px 紧凑双行。
   * 与日历主体共享同一套 Token（色板 / 字阶 / 圆角 / 阴影 / 动效），
   * 保证插件与弹出日历在视觉上是同一件产品的两个部分。
   *
   * ⚠️ 硬约束（勿改）：
   *   1) 卡片 inset 左上 2px、右下 0px —— 见下方 applyDockSize() 的注释，
   *      右下归零是 v1.7.22.4 修复「插件和任务栏之间有空白」的关键。
   *   2) 卡片阴影必须 y 偏移为 0（对称），否则底部投影会在插件与任务栏之间
   *      造出一条视觉缝隙，用户会反馈「没贴住」。
   *
   * ============================ v3.3.0 · 六套浮窗造型 ============================
   * 新增 <html data-shape="…">，六值（中文名同时冻结给皮肤窗与文档引用）：
   *   rect「圆角卡片」(默认) / pixel「像素方屏」/ rainbow「虹彩流光」
   *   ring「极简圆环」/ flip「翻页时牌」/ toon「绘本台钟」
   *
   * 为什么走「变量下沉 + 子元素装饰」两段式（而不是给 #card 写造型规则）：
   *   基础规则 body.hit #card:hover 特异性 (1,1,1)、tech/glass 装饰 (1,2,1)，若造型规则也
   *   写成 (1,1,1) 就会被同权反压、被 (1,2,1) 压过（见设计文档 §1.3）。对策：
   *   ① 把 #card 的底色/描边/阴影/圆角/裁剪/磨砂改成消费 --dock-*（缺省值逐字等于原值，
   *      rect 行为零变化）；非 rect 时由 JS 在 documentElement 上 inline setProperty ——
   *      inline 优先级高于任何样式表规则，彻底不参与特异性军备竞赛。
   *   ② 造型可见物（机身/黑屏/圆盘/翻牌/表身）一律画在 #shapeLayer 的子元素上，用
   *      html[data-shape="X"] 作用域限定；子元素选择器与既有 token 零交集，绝不误伤 #card。
   *   ③ 造型权威来源是 skin-state 的 resolved dock 状态里的 shape，渲染层不自行判断 follow。
   *
   * ⚠️ 三条不可回退（两条既有修复 + 一条硬约束）：
   *   - #skinImg { border-radius: inherit } 与 --dock-overflow 缺省 hidden（v3.2.1 四角修复）；
   *     flip/toon 必须显式把 --dock-overflow 放开为 visible，否则内层翻牌投影/落地影被切。
   *   - dockLayoutSkin 的视口改成「当前卡片尺寸」，不再写死 116×50（造型窗口尺寸随造型变）。
   *   - 非 rect 造型在**某条边**上的外投影 offset + blur 不得越出该造型在**该边**上的 pad。
   *     窗口比卡片盒大一圈（pad），这一圈是该边外投影唯一的可见空间；一旦越界就会被窗口矩形
   *     硬裁一刀，残留成直角边 —— 这正是 v3.3.0 X2「极简圆环外围方形黑框」的成因。
   *     判据是「逐边比」而非「统一值」：外投影只需 ≤ **同侧** pad。各造型 pad（权威源 =
   *     electron-main.js 的 DOCK_SHAPES 注册表）：
   *       · rect                        ：2 / 2 / 0 / 0（左上留 2，右下贴死窗口边，压任务栏）
   *       · pixel / ring / flip / toon  ：四边 12（会离开任务栏变桌面挂件，留出投影空间）
   *       · rainbow（v3.3.0 Y1 / §7.1）：padL=padT=24、padR=padB=0，卡片仍 116×44；
   *         左上 24 是纯透明区，卡片右/下沿贴死窗口，用于「贴任务栏上沿 + 贴屏幕右沿」。
   *         右下归零不复发 X2：其 --dock-shadow 两档**全是 inset**（见 `DOCK_SHAPE_VARS.rainbow`），
   *         窗口矩形上没有任何外投影可裁 ⇒ X2 的成因对它不成立。
   *     （已知取舍：圆环靠 20% 白描边定界，浅色壁纸上对比偏弱，属设计固有属性，非缺陷。）
   * ========================================================================== */

  /* ============================ L1 基础层 ============================ */

    --card: rgba(250, 250, 252, 0.95);

    --edge: rgba(31, 35, 48, 0.09);
    --hi: rgba(255, 255, 255, 0.85);          /* 顶部高光 */
    --ink: var(--ink-800);
    --ink-soft: var(--ink-600);
    /* v2.4.0 第二轮 皮肤层（浮动插件独立 per-surface，不跟随日历） */
    --skin-bg-solid: transparent;
    /* v2.4.4 自选纯色/图片皮肤：三层可读性变量（由 dockApplyClarity 按文字明暗 + clarity 写入） */
    --stroke-color: transparent;
    --ink-glow: 0 0 0 transparent;

    /* 阴影：y 偏移恒为 0（贴任务栏，不能有向下的投影） */

  /* ==========================================================================

   * --------------------------------------------------------------------------
   * v3.1.0（W-E）：与 template.html 重做后的六风格视觉对齐。浮窗不复用主窗 CSS，
   * 故此处独立同步（主窗的改动不会自动流到这里）。真源 = template.html §7 token。
   * 三轴解耦（§12）：data-theme=背景明暗、data-style=风格材质、data-text=文字轴。
   * 浅/深两档各自独立成块（[data-theme="light"|"dark"][data-style="X"]，同为 (0,2,0)
   * 互不越界）。变量按 dock 自己的体系落：--card/--card-hover/--edge/--hi/--ink/
   * --ink-soft/--accent/--accent-soft/--hover/--r-md/--dock-blur/--dock-sat。
   *
   * ⚠️ 硬约束（勿改，本轮已复核确认为真）：**不改 --shadow / --shadow-hover**。
   * 插件贴任务栏上沿，阴影 y 偏移必须恒为 0（见文件头注释 2 与 :root 内 --shadow 注释），
   * 否则底部投影会在插件与任务栏之间造出一条"没贴住"的视觉缝隙。template 里 neu 的
   * 斜向双向阴影（带 +y）因此在本微件上**结构性不可用** —— neu 的"挤出感"改由
   * 「同色卡面 + 亮色描边 + 更大圆角 + 顶部高光(--hi)」承载（见 ④）。
   *
   * 圆角对 116×50 微件做了按比例收敛（不照搬主窗 r-lg 的大圆角），保留风格特征即可：
   *   default 10 / minimal 11 / glass 14 / neu 16 / tech 8 / warm 12。
   * 装饰（网格/光斑/纸纹）克制处理：微件空间极小，避免特效糊成一团（见下方装饰层）。
   * 状态色守恒：休/异=红、上班=绿/青，仅调明度饱和度（§8.3）。
   * ========================================================================== */

  /* ---------- ① 默认（融合）：中性卡面 + 三层化层级（圆角 16→微件 10） ---------- */

  /* ---------- ③ 磨砂玻璃（C10：不靠 blur 糊桌面 → 页面自绘彩色光斑 + 分层假磨砂）----------

      repeating-linear-gradient(0deg, rgba(34, 211, 238, 0.18) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(90deg, rgba(34, 211, 238, 0.18) 0 1px, transparent 1px 14px),
      radial-gradient(130% 140% at 100% 0%, rgba(34, 211, 238, 0.50) 0%, transparent 58%),
      radial-gradient(130% 140% at 0% 100%, rgba(255, 43, 214, 0.42) 0%, transparent 60%),
      linear-gradient(160deg, #0e1727, #091018 58%, #060b12);
    --edge: rgba(34, 211, 238, 0.55); --hi: rgba(34, 211, 238, 0.10);
    --ink: #b8f7ff; --ink-soft: rgba(150, 240, 255, 0.74);
    --accent: #22d3ee; --accent-soft: rgba(34, 211, 238, 0.20);
    --hover: rgba(34, 211, 238, 0.12);
    --r-md: 8px; --dock-blur: 0px; --dock-sat: 1;
    --tech-ink-glow: 0 0 10px rgba(34, 211, 238, 0.55);
    --font-sans: "Cascadia Code", "Consolas", ui-monospace, "JetBrains Mono", monospace;
  }

  /* ---------- ⑥ 温润拟物（纸感 + 暖棕 + 衬线字；圆角 14→微件 12）----------
   * --card 直载「细纤维斜纹 + 暖羊皮纸渐变」（对应主窗 --warm-veil）。 */
  [data-theme="light"][data-style="warm"] {
    --card:
      repeating-linear-gradient(45deg, rgba(120, 90, 50, 0.045) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, #fffdf7, #faf1e0 55%, #f6ecda);
    --card-hover:
      repeating-linear-gradient(45deg, rgba(120, 90, 50, 0.06) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, #fefbf3, #f6ecd8 55%, #f2e6d0);
    --edge: #e7dbc4; --hi: rgba(255, 255, 255, 0.75);
    --ink: #4a3f33; --ink-soft: #5b4a36;
    --accent: #b5602f; --accent-soft: rgba(181, 96, 47, 0.14);
    --hover: rgba(181, 96, 47, 0.08);
    --r-md: 12px; --dock-blur: 0px; --dock-sat: 1;
    --font-sans: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  }
  [data-theme="dark"][data-style="warm"] {
    --card:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.018) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, #2e2618, #241c12 58%, #1e170e);
    --card-hover:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.026) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, #362c1c, #292015 58%, #221a10);
    --edge: #4a3f2c; --hi: rgba(255, 255, 255, 0.05);
    --ink: #efe4d2; --ink-soft: #c6b79a;
    --accent: #d98a55; --accent-soft: rgba(217, 138, 85, 0.18);
    --hover: rgba(217, 138, 85, 0.10);
    --r-md: 12px; --dock-blur: 0px; --dock-sat: 1;
    --font-sans: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
  }

  /* ==========================================================================
   * v3.0.0 §3.2 文字轴 data-text（只覆盖「文字相关」变量）
   * light=深字（浅底语义）、dark=浅字；auto/缺失 → 不设属性，跟随 [data-theme]。
   * :root[...] 特异性 (0,2,0)，置于全部 [data-style] 之后，与 [data-theme][data-style]
   * 同权靠源序取胜 → 文字轴恒压过风格档。仅动 --ink/--ink-soft/--stroke-color/--ink-glow。
   * ========================================================================== */
  :root[data-text="light"] {
    --ink: #1f2430; --ink-soft: #4b5563;
    --stroke-color: rgba(255, 255, 255, 0.70);
    --ink-glow: 0 0 0 transparent;
  }
  :root[data-text="dark"] {
    --ink: #e8eaf0; --ink-soft: #9aa3b3;
    --stroke-color: rgba(0, 0, 0, 0.55);
    --ink-glow: 0 0 0 transparent;
  }

  /* ==========================================================================
   * v3.1.0 §3 六风格视觉重做 · 装饰层（仅原生模式；选「纯色/图片」皮肤时让位给皮肤层）
   * --------------------------------------------------------------------------
   * tech  → 四角切角(clip-path，微件收敛到 6px) + 主文字霓虹微发光
   * glass → 斜向高光带（::after 伪元素，pointer-events:none 不拦交互）
   * warm/default/minimal/neu → 材质已由上方 token 承载，无需附加规则
   * 选择器一律 html 前缀 + :not([data-skin])（既有铁律，见文件头与 v3.0.0 注），
   * 既保证特异度压过基础 #card，又保证用户选皮肤时不抢背景/不误裁图片。
   * ========================================================================== */
  /* 赛博朋克：四角切角。clip-path 会连带裁掉向外的 box-shadow（--shadow 未改，
   * 外圈光晕在切角下被裁属预期），故靠网格 + 双霓虹光晕 + 文字发光立住"科技感"。 */
  html[data-style="tech"]:not([data-skin]) #card {
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px),
                       calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
  }
  /* 赛博朋克：主文字霓虹微发光（与主窗 #clkTime 等一致的 --tech-ink-glow） */
  html[data-style="tech"]:not([data-skin]) #dockTime,
  html[data-style="tech"]:not([data-skin]) #dockWeek,
  html[data-style="tech"]:not([data-skin]) #dockDateNum {
    text-shadow: var(--tech-ink-glow);
  }
  /* 磨砂玻璃：一条边界可辨的斜向光泽带（有峰值有回落，不是均匀提亮）——
   * v3.1.0 返工：与主窗同步为 .58 峰值带（配合顶层白洗降到 .34/.20，光带才不被摊平）。 */
  html[data-style="glass"]:not([data-skin]) #card::after {
    content: ''; position: absolute; inset: 0; z-index: 2; border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(115deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.58) 16%,
      rgba(255, 255, 255, 0.10) 34%,
      rgba(255, 255, 255, 0) 52%);
  }

  /* v2.4.0 第二轮 自选纯色/图片皮肤：只覆盖卡片 #card（窗口外透明区保持穿透，不改 body）。
   * 皮肤只改背景层，文字明暗由 data-theme 全量驱动；状态色/强调色仍取生效主题 token。 */
  /* v3.0.0：皮肤层规则一律加 html 前缀（特异性 (0,1,1)→(1,1,1)），避免被源序更后的
   * 同特异性主题/风格规则反压（与 template.html 四角黑边同一铁律，见 MEMORY.md 第二节）。 */
  html[data-skin="color"] #card { background: var(--skin-bg-solid); }
  /* v2.4.4 图片皮肤：#card 铺局部保护遮罩（透明底 + --protect-mid 罩层，提升文字对比）。 */
  html[data-skin="image"] #card { background: var(--protect-mid); }

  /* v2.4.4 自选纯色/图片皮肤：文字兜底极细描边 + 柔和光晕（由 dockApplyClarity 按明暗写入）。
   * 原生皮肤无 [data-skin]，不触发。 */
  html[data-skin="color"] #dockTime, html[data-skin="image"] #dockTime,
  html[data-skin="color"] #dockWeek, html[data-skin="image"] #dockWeek,
  html[data-skin="color"] #dockDateNum, html[data-skin="image"] #dockDateNum {
    -webkit-text-stroke: 0.5px var(--stroke-color);
    text-shadow: var(--ink-glow);
  }

  /* v2.4.2 修复「纯色/图片模式点击闪黑 + 方方正正 + 两层堆叠」：
   * 根因 1) 主进程把 dock 窗口 setBackgroundColor(不透明色) → 透明窗口退化成方形色块，
   *        圆角透明区/阴影失效，形成"底子+色块"两层；已在 electron-main.js bgColorFor 改为始终透明。
   * 根因 2) body.hit #card:hover 优先级高于 [data-skin]，hover 把自选背景换成 --card-hover
   *        （黑夜底子）→ 点击闪黑。
   * 因此不再单独剥离描边/阴影：纯色/图片复用原生模式的 --edge 描边 + --shadow 阴影 + 顶部高光
   * （圆角随 #card 不变），仅在 hover 时锁住自选背景，其余点按反馈与原生一致。
   * v3.0.0：修正选择器 —— data-skin 挂在 <html>（root.dataset.skin），原 `body.hit[data-skin=…]`
   * 要求 <body> 带该属性（永不成立，规则形同虚设）；改为 `html[data-skin=…] body.hit` 使其真正生效。 */
  html[data-skin="color"] body.hit #card:hover { background: var(--skin-bg-solid); }
  html[data-skin="image"] body.hit #card:hover { background: var(--protect-mid); }

  /* ============================ L3 组件层 ============================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-sans);
    background: transparent;
    -webkit-user-select: none; user-select: none;
    cursor: pointer;
    -webkit-font-smoothing: antialiased;
  }

  #card {
    position: absolute; z-index: 0;
    /* 初始占位，与 applyDockSize() 的 padL/T/R/B 保持一致（右下 0 让卡片贴死窗口边） */
    left: 2px; top: 2px; right: auto; bottom: auto;
    /* v3.3.0 C7.2：圆角/裁剪/底色/描边/阴影/磨砂统一消费 --dock-*（缺省值逐字等于原值，
     * rect 行为零变化；非 rect 由 JS 在 documentElement 上 inline 覆盖，见文件头说明）。 */
    border-radius: var(--dock-radius, var(--r-md));
    /* v3.2.1 形状修复（用户报告「圆边和方形并存」）：
     * 卡片自己画了圆角，但子层 #skinImg 是直角矩形且 inset:0 铺满整个卡片，而卡片
     * 没有裁剪 —— 图片把圆角和 1px 描边整块盖住，四个角全被"削方"。此前看到的圆角
     * 其实只是 box-shadow 跟随圆角的残影；而卡片右边/下边贴死窗口（padR=padB=0）又把
     * 阴影裁掉，于是只剩左上看得见弧线 → 「左边圆、右边方」。加裁剪即修好。
     * 注：box-shadow 画在元素盒外，不受自身 overflow 影响，阴影行为不变。
     * v3.3.0：hidden 仍是缺省值（它同时承担「图片层不溢出圆角」的职责）；flip / toon 的
     * 可见物在卡片外（翻牌投影 / 表身落地影），由造型显式覆盖 --dock-overflow:visible。 */
    overflow: var(--dock-overflow, hidden);
    background: var(--dock-bg, var(--card));
    /* v3.0.0 §7：模糊/饱和随风格档（--dock-blur/--dock-sat），缺省沿用原 10px/1.3 */
    -webkit-backdrop-filter: blur(var(--dock-blur, 10px)) saturate(var(--dock-sat, 1.3));
    backdrop-filter: blur(var(--dock-blur, 10px)) saturate(var(--dock-sat, 1.3));
    border: 1px solid var(--dock-edge, var(--edge));
    box-shadow: var(--dock-shadow, var(--shadow));
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    transition: background var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                transform var(--dur-instant) var(--ease-out);
  }
  /* v2.4.0 第二轮 图片皮肤背景层：铺满 #card、位于内容之下（负 z-index 落入 #card stacking context）。
   * background-image/size/position 由 applySkinImage 按 crop+zoom 换算写入。 */
  #skinImg {
    position: absolute; inset: 0; z-index: -1;
    /* v3.2.1：双保险 —— 图片层显式跟随卡片轮廓。父级 #card 的 overflow:hidden 已能兜住
     * 圆角形状；这一条额外保证「轮廓样式」为 clip-path（斜切/徽章）等新形状时同样贴合。 */
    border-radius: inherit;
    background-repeat: no-repeat;
    background-color: transparent;
    pointer-events: none;
  }
  /* hover 高亮只在「实际可点」（body.hit）时出现，与点击热区保持一致 ——
     鼠标停在方框外的透明区域时不给"这里能点"的错误暗示（此时点击穿透给下面窗口）。 */
  body.hit #card:hover {
    background: var(--dock-bg-hover, var(--card-hover));
    box-shadow: var(--dock-shadow-hover, var(--shadow-hover));
    border-color: var(--dock-edge-hover, var(--accent-soft));
  }
  #card:active { transform: scale(0.965); }

  #dockTime {
    font-size: var(--fs-2xl); font-weight: var(--fw-bold); line-height: 1;
    letter-spacing: 0.3px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-feature-settings: var(--font-num-feat);
  }
  #dockDate {
    display: flex; align-items: center; justify-content: center;
    gap: 6px;              /* v2.4.0 A6：星期与日期间距放宽 */
    font-size: var(--fs-xs); font-weight: var(--fw-semibold); line-height: 1;
    letter-spacing: 0.4px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    font-feature-settings: var(--font-num-feat);
  }
  #dockDate span { display: inline-block; }

  /* ==========================================================================
   * v3.3.0 C7.3 造型专属装饰层（视觉真源 = deliverables/design/v3.3.0-shape-spec/
   *   shape-preview-workbench.js 第四版 CSS 数组；此处按其数值改写，class 名映射到 dock.html）
   * --------------------------------------------------------------------------
   * 结构：#card 内的 #shapeLayer 承载全部造型可见物；六套造型各自一个 .shape-<key> 包裹。
   * 显隐：默认 .shape{display:none}，只有 html[data-shape="X"] .shape-X 显示 ——
   *   一次建好六套 DOM，切换只改根属性，避免「切一次建一次」的状态残留。
   * 坐标：#shapeLayer 用 inset:-1px 精确覆盖 #card 的 border-box（抵消 1px 透明描边），
   *   使造型内部 px 坐标与预览工装的 158×174 / 156×64 / 150×150 等设计尺寸 1:1 对应。
   * pointer-events:none：#shapeLayer 不接收鼠标，让 mousedown/click 全部落在 #card 本体，
   *   #card:active 缩放与「几何判定热区」的既有链路一字未动。
   * ========================================================================== */
  #shapeLayer { position: absolute; inset: -1px; pointer-events: none; }
  .shape { display: none; }
  /* 字底晕圈（预览工装 .halo）：四向 1px 暗描边 + 柔和投影，浅色壁纸上也能读 */
  .halo {
    filter: drop-shadow(1px 0 0 rgba(0,0,0,.5)) drop-shadow(-1px 0 0 rgba(0,0,0,.5))
            drop-shadow(0 1px 0 rgba(0,0,0,.5)) drop-shadow(0 -1px 0 rgba(0,0,0,.5))
            drop-shadow(0 2px 5px rgba(0,0,0,.45));
  }
  /* 非 rect：rect 的文本层 / 图片皮肤层一律让位（内容改由造型层承担） */
  html:not([data-shape="rect"]) #dockTime,
  html:not([data-shape="rect"]) #dockDate,
  html:not([data-shape="rect"]) #skinImg { display: none; }

  /* ---------- ① 像素方屏 pixel（机身由 --dock-* 承载，黑屏是内层） ---------- */
  html[data-shape="pixel"] .shape-pixel { display: block; }
  html[data-shape="pixel"] .px-scr {
    position: absolute; inset: 5px; border-radius: 10px; overflow: hidden;
    background: radial-gradient(120% 130% at 50% 0%, #0a121b, #04070b 72%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.9), inset 0 0 15px rgba(0,150,255,.14);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  html[data-shape="pixel"] .px-tm { display: flex; gap: 4.5px; align-items: center; }
  html[data-shape="pixel"] .px-scr .g { display: grid; grid-auto-rows: 3.2px; gap: 1.3px; }
  html[data-shape="pixel"] .px-scr .g i { display: block; border-radius: 1px; }
  html[data-shape="pixel"] .px-scr .g i.on { background: #b3ecff; box-shadow: 0 0 2px rgba(120,215,255,.85); }
  html[data-shape="pixel"] .px-scr .g i.off { background: rgba(120,190,255,.045); }
  html[data-shape="pixel"] .px-dt {
    font-family: Consolas, monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 1.6px;
    color: #4fb6e6; text-shadow: 0 0 5px rgba(90,200,255,.65);
  }

  /* ---------- ② 虹彩流光 rainbow（一层近乎透明的玻璃薄片，只留彩虹渐变内容） ---------- */
  html[data-shape="rainbow"] .shape-rainbow {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; height: 100%;
  }
  html[data-shape="rainbow"] .rb-t {
    font-size: 21px; font-weight: 800; line-height: 1; letter-spacing: .4px;
    background-image: linear-gradient(100deg, #ff4f7d, #ffa63d 22%, #4fe08f 44%, #38bdf8 64%, #a855f7 84%, #ff4f7d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  html[data-shape="rainbow"] .rb-d {
    font-size: 9.5px; font-weight: 700; line-height: 1; letter-spacing: .9px;
    background-image: linear-gradient(100deg, #ff9db8, #ffd79a 30%, #a9f0c6 55%, #a5dcf9 75%, #d3a8e0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- ③ 极简圆环 ring（磨砂圆盘 + 圆环进度，环随秒走满一圈） ---------- */
  html[data-shape="ring"] .shape-ring { display: flex; align-items: center; justify-content: center; height: 100%; }
  html[data-shape="ring"] .cr-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  html[data-shape="ring"] .cr-in {
    position: relative; z-index: 2; text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,.55), 0 0 14px rgba(0,0,0,.3);
  }
  html[data-shape="ring"] .cr-date { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.94); letter-spacing: .6px; }
  html[data-shape="ring"] .cr-time {
    font-size: 34px; font-weight: 700; color: #fff; line-height: 1; margin: 7px 0 6px;
    letter-spacing: .5px; font-variant-numeric: tabular-nums;
  }
  html[data-shape="ring"] .cr-week { font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,.9); letter-spacing: 1.6px; }

  /* ---------- ④ 翻页时牌 flip（三块深色翻牌 时/分/秒，24 小时制无午别） ---------- */
  html[data-shape="flip"] .shape-flip {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 9px; height: 100%;
  }
  html[data-shape="flip"] .fl-hdr { font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.96); letter-spacing: 1.1px; white-space: nowrap; }
  html[data-shape="flip"] .fl-hdr i { font-style: normal; opacity: .66; margin-left: 6px; letter-spacing: .6px; }
  html[data-shape="flip"] .fl-tiles { display: flex; gap: 9px; }
  html[data-shape="flip"] .fl-tile {
    position: relative; width: 58px; height: 72px; border-radius: 10px; overflow: hidden;
    background: linear-gradient(180deg, #3b4046, #2c3035 49.6%, #24282c 50.4%, #1d2124);
    box-shadow: 0 3px 10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
  }
  html[data-shape="flip"] .fl-tile::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
    background: rgba(255,255,255,.16); z-index: 1;
  }
  html[data-shape="flip"] .fl-dg {
    position: relative; z-index: 2; font-size: 33px; font-weight: 700; color: #fff; line-height: 1;
    letter-spacing: -.5px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }

  /* ---------- ⑤ 绘本台钟 toon（简笔画 / 儿童绘本：粗暖墨线 + 蜡笔平涂 + 有意涂出界的色块） ---------- */
  html[data-shape="toon"] .shape-toon {
    display: block; height: 100%;
    font-family: "Segoe Print", "Comic Sans MS", "Microsoft YaHei", sans-serif;
  }
  /* 落地影：软椭圆，给「摆件」一点重量，不然像浮在壁纸上 */
  html[data-shape="toon"] .pb-gnd {
    position: absolute; left: 50%; bottom: -2px; margin-left: -42px; width: 84px; height: 13px;
    border-radius: 50%; background: radial-gradient(closest-side, rgba(62,50,41,.26), rgba(62,50,41,0));
  }

          root.style.removeProperty('--skin-bg-solid');
          dockApplyClarity(root, theme, clarity);
          dockApplyImage(state.image);
        } else {
          delete root.dataset.skin;
          root.style.removeProperty('--skin-bg-solid');
          dockClearReadability(root);
          var i1 = document.getElementById('skinImg');
          if (i1) { i1.style.backgroundImage = ''; i1.style.opacity = ''; }
        }
      }
      /* v2.4.4 自选皮肤：三层可读性变量（#card 保护遮罩 + 文字光晕 + 兜底描边），由 clarity 联动。 */
      function dockApplyClarity(root, theme, clarity) {
        if (!root) return;
        // v2.4.4：非法 clarity（'auto' / undefined / NaN / ±Infinity）一律按 0 处理（保护层归零），
        // 防止 NaN 落入 p>0 分支写出非法 CSS；合法数字输入零变化。
        if (typeof clarity !== 'number' || !isFinite(clarity)) clarity = 0;
        var p = Math.max(0, Math.min(1, (clarity || 0) / 100));
        var ink = (theme === 'dark') ? '0,0,0' : '255,255,255';
        // v2.4.4：clarity=0 → 保护层归零（不引入多余灰罩）；仅留主题兜底描边。
        if (p <= 0) {
          root.style.setProperty('--protect-mid', 'transparent');
          root.style.setProperty('--ink-glow', '0 0 0 transparent');
          var sa0 = (theme === 'dark') ? 0.55 : 0.70;
          root.style.setProperty('--stroke-color', 'rgba(' + ink + ',' + sa0.toFixed(3) + ')');
          return;
        }
        function a(base, k) { return (base + k * p).toFixed(3); }
        root.style.setProperty('--protect-mid', 'rgba(' + ink + ',' + a(0.03, 0.20) + ')');
        root.style.setProperty('--ink-glow', '0 0 ' + (1 + 3 * p).toFixed(1) + 'px rgba(' + ink + ',' + a(0.35, 0.35) + ')');
        var sa = (theme === 'dark') ? (0.55 - 0.25 * p) : (0.70 - 0.30 * p);
        root.style.setProperty('--stroke-color', 'rgba(' + ink + ',' + sa.toFixed(3) + ')');
      }
      function dockClearReadability(root) {
        if (!root) return;
        root.style.removeProperty('--protect-mid');
        root.style.removeProperty('--ink-glow');
        root.style.removeProperty('--stroke-color');
      }
      function dockSetFrozen(frozen) {
        frozen = !!frozen;
        if (dockHidden === frozen) return;
        dockHidden = frozen;
        if (dockSkin && dockSkin.bg === 'image' && dockSkin.image) dockApplyImage(dockSkin.image);
      }
      if (window.api && window.api.onSkinState) {
        window.api.onSkinState(function (state) {
          if (!state) return;
          dockSkin = state.dock || null;
          /* v3.3.0 C7.7：造型权威来源 = skin-state 里 resolved 的 dock 状态（state.dock 即主进程
           * resolvedSurfaceState('dock') 的结果；兼容取 state.resolved.dock）。顺序必须是先定造型
           * （写 data-shape + --dock-*）再上皮肤 —— 否则 dockApplySkin 会拿旧的 dockShape 判断，
           * 切到非 rect 的那一帧仍会写 data-style/data-skin。 */
          var sh = dockSkin && dockSkin.shape;
          if (!sh && state.resolved && state.resolved.dock) sh = state.resolved.dock.shape;
          applyShape(sh);
          dockApplySkin(dockSkin);
        });
      }
      document.addEventListener('visibilitychange', function () {
        dockSetFrozen(document.hidden);
      });

      buildAllShapes();     // v3.3.0：六套造型 DOM 一次建好（data-shape 初始为 rect，均不显示）
      applyDockSize();      // v1.7.19：先用默认尺寸占位，IPC 到达后再校准为真实值
      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
