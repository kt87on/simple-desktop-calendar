<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皮肤设置</title>
<style>
  /* ==========================================================================
   * 皮肤设置窗口 · v3.2.0（主视图收成两个入口）
   * --------------------------------------------------------------------------
   * 语义定位：主视图只做两件事 ——
   *   ① 「原生皮肤」入口：点击动画下拉出 6 行风格，每行带一枚**该风格真实观感**的迷你预览；
   *   ② 「自选图片」入口：点击**开一个独立新窗口**（由主进程 open-custom 负责，本窗只发起）。
   * 为什么把细调能力（界面选择器 / 背景来源 / 明暗 / 文字 / 清晰度 / 透明度 / 图片取景 /
   * 跟随开关）**整体移出本文件**：用户明确要求主视图只剩两个入口，细调搬去独立窗口
   * （skincustom.html）。故本文件**不再存在任何 per-surface 控件**，杜绝「窗内浮层 + 主视图」
   * 两套心智模型的割裂。
   * 主进程是唯一真相：选风格走 skinAction('apply-native-style')（一次原子写 4 个面），
   * 本窗只订阅 skin-config-state 做高亮回显，自身不应用皮肤背景、只跟随基准主题 baseTheme()。
   * ========================================================================== */

  /* ============================ L1 基础层 ============================ */
  :root {
    --ink-900: #14181f; --ink-800: #1f2430; --ink-700: #333a48; --ink-600: #4b5563;
    --ink-500: #6b7280; --ink-400: #9aa1ad; --ink-300: #c2c8d2; --ink-200: #e2e6ec;
    --ink-100: #f0f2f5; --ink-50: #f7f8fa; --ink-25: #fcfbf9;

    --blue-50: #eff4fc; --blue-100: #dae6fa; --blue-200: #b9cff5; --blue-300: #8fb0ec;
    --blue-400: #6389df; --blue-500: #3b6fd4; --blue-600: #1976d2; --blue-700: #155ba6;

    --red-500: #d6453f; --red-600: #bf3330;

    --fs-2xs: 9px; --fs-xs: 10px; --fs-sm: 11px; --fs-md: 13px; --fs-lg: 14px; --fs-xl: 15px;

    --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;

    --font-sans: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI",
                 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
                 "Hiragino Sans GB", system-ui, -apple-system, sans-serif;

    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
    --r-xs: 4px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 16px; --r-pill: 999px;

    --dur-instant: 80ms; --dur-fast: 140ms; --dur-normal: 220ms;
    --ease-out: cubic-bezier(.22, .61, .36, 1);
    --ease-spring: cubic-bezier(.34, 1.46, .64, 1);

    /* ========== L2 语义层 · 白日 ========== */
    --paper: #ffffff;
    --paper-edge: rgba(31, 35, 48, 0.10);
    --paper-hi: rgba(255, 255, 255, 0.85);
    --ink: var(--ink-800);
    --ink-soft: var(--ink-500);
    --ink-faint: var(--ink-400);

    --accent: var(--blue-500);
    --accent-hover: var(--blue-600);
    --accent-glow: rgba(59, 111, 212, 0.30);
    --accent-ink: var(--blue-700);
    --accent-soft: rgba(59, 111, 212, 0.10);

    --head-bg: linear-gradient(180deg, rgba(59, 111, 212, 0.10), rgba(59, 111, 212, 0));
    --head-line: rgba(31, 35, 48, 0.07);
    --row-line: rgba(31, 35, 48, 0.05);
    --ctl-bg: #ffffff;
    --ctl-edge: rgba(31, 35, 48, 0.12);
    --track-off: rgba(31, 35, 48, 0.14);

    --e-3: 0 20px 52px rgba(31, 35, 48, 0.26), 0 4px 14px rgba(31, 35, 48, 0.10),
           inset 0 1px 0 var(--paper-hi);
  }

  /* ========== L2 语义层 · 黑夜 ========== */
  html[data-theme="dark"] {
    --paper: #1e222e;
    --paper-edge: rgba(255, 255, 255, 0.09);
    --paper-hi: rgba(255, 255, 255, 0.055);
    --ink: #e8eaf0;
    --ink-soft: #9aa3b3;
    --ink-faint: #6a7283;

    --accent: #4a86ef;
    --accent-hover: #5f97f5;
    --accent-glow: rgba(74, 134, 239, 0.32);
    --accent-ink: #8fb2f7;
    --accent-soft: rgba(74, 134, 239, 0.16);

    --head-bg: linear-gradient(180deg, rgba(74, 134, 239, 0.14), rgba(74, 134, 239, 0));
    --head-line: rgba(255, 255, 255, 0.07);
    --row-line: rgba(255, 255, 255, 0.05);
    --ctl-bg: rgba(255, 255, 255, 0.07);
    --ctl-edge: rgba(255, 255, 255, 0.12);
    --track-off: rgba(255, 255, 255, 0.18);

    --e-3: 0 24px 60px rgba(0, 0, 0, 0.66), 0 6px 16px rgba(0, 0, 0, 0.42),
           inset 0 1px 0 var(--paper-hi);
  }

  /* ============================ L3 组件层 ============================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    font-family: var(--font-sans); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #card {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--paper); border-radius: var(--r-xl);
    border: 1px solid var(--paper-edge); box-shadow: var(--e-3); overflow: hidden;
  }

  #head {
    flex: 0 0 48px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--s-3) 0 var(--s-4);
    background: var(--head-bg); border-bottom: 1px solid var(--head-line);
    /* 保留原窗口拖动机制：标题栏整块可拖拽，交互控件用 no-drag 排除 */
    -webkit-app-region: drag; user-select: none; -webkit-user-select: none; cursor: move;
  }
  #head:active { cursor: grabbing; }
  #head .title { display: flex; align-items: center; gap: var(--s-2); color: var(--accent-ink); font-size: var(--fs-xl); font-weight: var(--fw-bold); letter-spacing: 0.3px; }
  #head .icon { width: 18px; height: 18px; flex: 0 0 auto; color: var(--accent); }
  #btnClose {
    width: 26px; height: 26px; border: none; border-radius: var(--r-sm);
    background: transparent; color: var(--ink-faint); cursor: pointer;
    font-size: var(--fs-lg); line-height: 1; display: flex; align-items: center; justify-content: center;
    -webkit-app-region: no-drag;
    transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  #btnClose:hover { background: var(--accent-soft); color: var(--ink); }

  /* 主视图容器：必须可纵向滚动 —— #nativeList 展开后总高可能超出 640 窗口 */
  #body { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: var(--s-3) var(--s-4) var(--s-4); }

  /* ===== 入口按钮（「原生皮肤」/「自选图片」）=====
   * 为什么做成整行可点：两个入口是主视图仅剩的交互，目标越大越不易误点；
   * 左侧图标表意、右侧 chevron 仅「原生皮肤」有（表示可展开）。 */
  .entry {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
    width: 100%; padding: 12px var(--s-3); margin: 0 0 var(--s-2);
    border: 1px solid var(--ctl-edge); border-radius: var(--r-md);
    background: var(--ctl-bg); color: var(--ink);
    font-family: inherit; font-size: var(--fs-md); font-weight: var(--fw-semibold);
    letter-spacing: 0.4px; text-align: left; cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                background-color var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out);
  }
  .entry:hover { border-color: var(--accent); color: var(--accent-ink); }
  /* active = 该入口当前「有内容在用」：原生=日历风格已生效；自选=任一面已用图片 */
  .entry.active {
    border-color: var(--accent); color: var(--accent-ink);
    box-shadow: 0 0 0 2px var(--accent-soft); background: var(--accent-soft);
  }
  .entry-main { display: inline-flex; align-items: center; gap: var(--s-2); min-width: 0; }
  .entry-icon { width: 16px; height: 16px; flex: 0 0 auto; color: var(--accent); }
  /* chevron：展开时旋转 180°，用 transform 过渡（合成层动画，不触发重排） */
  .chev {
    width: 16px; height: 16px; flex: 0 0 auto; color: var(--ink-faint);
    transition: transform var(--dur-normal) var(--ease-out);
  }
  #entryNative[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* ===== 6 行原生风格列表（动画展开/收起）=====
   * 为什么用 max-height + opacity 而非 height:auto：CSS 无法对 height:auto 过渡，
   * max-height 是纯合成过渡、无需 JS 量高（避免布局抖动）；同时淡入淡出，观感更顺。 */
  .native-list {
    overflow: hidden;
    max-height: 0; opacity: 0;
    transition: max-height var(--dur-normal) var(--ease-out),
                opacity var(--dur-fast) var(--ease-out);
  }
  .native-list.open { max-height: 420px; opacity: 1; }

  .style-row {
    display: flex; align-items: center; gap: var(--s-3);
    width: 100%; min-height: 46px; padding: 8px 10px; margin: 0 0 var(--s-2);
    border: 1px solid var(--ctl-edge); border-radius: var(--r-md);
    background: var(--ctl-bg); color: var(--ink);
    font-family: inherit; font-size: var(--fs-md); font-weight: var(--fw-semibold);
    letter-spacing: 0.4px; text-align: left; cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                background-color var(--dur-fast) var(--ease-out);
  }
  .style-row:hover { border-color: var(--accent); }
  /* 选中态：仅当「日历面 = 该风格」且「日历面 bg = native」时由 JS 施加 */
  .style-row.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
    background: var(--accent-soft);
  }
  .style-name { font-weight: var(--fw-semibold); }

  /* ===== 迷你预览条（约 150×30）=====
   * 关键：预览**恒定渲染该风格的原生观感**（深底/浅底、配色、质感、字色都不随本窗主题变），
   * 否则用户无法「一眼看出是哪套皮肤」。取色全部来自 template.html:263-521 的风格 token。 */
  .pv { position: relative; flex: 0 0 auto; width: 150px; height: 30px; border-radius: 8px; }

  /* ① default 默认：浅灰扁平（轻玻璃的克制版）—— template.html:275-291
   *    paper #fcfbf9 / edge rgba(31,35,48,.12) / accent #3b6fd4 */
  .pv-default {
    background: linear-gradient(180deg, #ffffff, #f4f2ee);
    border: 1px solid rgba(31, 35, 48, 0.12);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 1px 2px rgba(31, 35, 48, 0.08);
  }
  .pv-default::before { content: ''; position: absolute; left: 9px; top: 9px; width: 30px; height: 3px; border-radius: 2px; background: #3b6fd4; }
  .pv-default::after  { content: ''; position: absolute; left: 9px; top: 18px; width: 72px; height: 3px; border-radius: 2px; background: rgba(31, 35, 48, 0.20); }

  /* ② minimal 极简：纯白 + 极细线 + 近黑强调，无模糊 —— template.html:310-324
   *    paper #ffffff / edge #ececef / accent #16171a */
  .pv-minimal {
    background: #ffffff;
    border: 1px solid #ececef;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  .pv-minimal::before { content: ''; position: absolute; left: 9px; top: 11px; width: 58px; height: 2px; background: #16171a; }
  .pv-minimal::after  { content: ''; position: absolute; left: 9px; top: 19px; width: 30px; height: 2px; background: #a1a1aa; }

  /* ③ glass 玻璃拟态：半透明白洗 + 彩色光斑 + 斜向光泽带 —— template.html:341-366, 567-582
   *    glass-sheen-a .34 / glass-veil 三光斑 / edge rgba(255,255,255,.85)；光泽带峰值 .58（有回落） */
  .pv-glass {
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.14)),
      radial-gradient(70px 60px at 14% 16%, rgba(255, 150, 214, 0.55), transparent 72%),
      radial-gradient(90px 72px at 88% 12%, rgba(140, 124, 255, 0.46), transparent 74%),
      radial-gradient(104px 82px at 68% 100%, rgba(80, 200, 255, 0.42), transparent 72%),
      linear-gradient(150deg, #eef0ff, #e7ecff 58%, #f2ecff);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.90);
  }
  .pv-glass::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.58) 16%,
      rgba(255, 255, 255, 0.10) 34%,
      rgba(255, 255, 255, 0) 52%);
  }

  /* ④ neu 新拟态：同底色双向柔影「凸起」+ 内凹控件 —— template.html:401-417, 592-605
   *    paper #dfe6f0 / neu-dark #b9c4d6 / neu-light #ffffff；不裁剪以保留外阴影 */
  .pv-neu {
    background: #dfe6f0;
    box-shadow: 5px 5px 10px #b9c4d6, -5px -5px 10px #ffffff;
  }
  .pv-neu::before {
    content: ''; position: absolute; left: 11px; top: 8px; width: 46px; height: 14px; border-radius: 7px;
    background: #dfe6f0;
    box-shadow: inset 3px 3px 6px #b9c4d6, inset -3px -3px 6px #ffffff;
  }

  /* ⑤ tech 科技感（赛博）：深底 + 青/品红霓虹 + 网格 + 12px 切角 —— template.html:464-488, 545-565
   *    paper #060a12 / tech-grid rgba(34,211,238,.14) / tech-glow-a 青 .42 / tech-glow-b 品红 .34
   *    赛博 cy​​an 取 dark 档 --accent #22d3ee（浅档 --accent 为 #06b6d4） */
  .pv-tech {
    background:
      repeating-linear-gradient(0deg, rgba(34, 211, 238, 0.14) 0 1px, transparent 1px 10px),
      repeating-linear-gradient(90deg, rgba(34, 211, 238, 0.14) 0 1px, transparent 1px 10px),
      radial-gradient(96px 64px at 100% 0%, rgba(34, 211, 238, 0.42) 0%, transparent 56%),
      radial-gradient(96px 64px at 0% 100%, rgba(255, 43, 214, 0.34) 0%, transparent 58%),
      linear-gradient(160deg, #0a1220, #060a12 58%, #04070d);
    border: 1px solid rgba(34, 211, 238, 0.55);
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.40), inset 0 0 14px rgba(34, 211, 238, 0.16);
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px),
                       calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  }
  .pv-tech::before { content: ''; position: absolute; left: 11px; top: 13px; width: 52px; height: 3px; background: #22d3ee; box-shadow: 0 0 8px rgba(34, 211, 238, 0.90); }
  .pv-tech::after  { content: ''; position: absolute; right: 11px; top: 13px; width: 18px; height: 3px; background: #ff2bd6; box-shadow: 0 0 8px rgba(255, 43, 214, 0.80); }

  /* ⑥ warm 温润拟物：暖米色纸感 + 细纤维斜纹 + 柔和边缘 —— template.html:491-511, 584-587
   *    paper #fffdf7 / edge #e7dbc4 / warm-veil 纤维斜纹 + 羊皮纸渐变 / accent #b5602f */
  .pv-warm {
    background:
      repeating-linear-gradient(45deg, rgba(120, 90, 50, 0.045) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, #fffdf7, #faf1e0 55%, #f6ecda);
    border: 1px solid #e7dbc4;
    box-shadow: inset 0 1px 0 #ffffff, 0 1px 3px rgba(120, 90, 50, 0.18);
  }
  .pv-warm::before { content: ''; position: absolute; left: 9px; top: 9px; width: 50px; height: 4px; border-radius: 2px; background: #b5602f; }
  .pv-warm::after  { content: ''; position: absolute; left: 9px; top: 18px; width: 80px; height: 3px; border-radius: 2px; background: rgba(74, 63, 51, 0.30); }

  /* ===== 风格名文字颜色 = 该皮肤的字色（分浅/深主题两档）=====
   * 为什么要分两档：本窗主题随 baseTheme()（浅或深）变，若只用单一字色，
   * 深档字色在浅底窗 / 浅档字色在深底窗会不可读。故取 template.html 中该风格的
   * light/dark 两套 --ink（或 --accent-ink），让「字色对应皮肤」且两主题都可读。 */
  .style-row[data-style="default"] .style-name { color: #4b5563; }
  html[data-theme="dark"] .style-row[data-style="default"] .style-name { color: #b9c0cc; }
  .style-row[data-style="minimal"] .style-name { color: #16171a; }
  html[data-theme="dark"] .style-row[data-style="minimal"] .style-name { color: #f4f4f5; }
  .style-row[data-style="glass"] .style-name { color: #5a4be0; }
  html[data-theme="dark"] .style-row[data-style="glass"] .style-name { color: #c6bcff; }
  .style-row[data-style="neu"] .style-name { color: #35608f; }
  html[data-theme="dark"] .style-row[data-style="neu"] .style-name { color: #8fc6e8; }
  .style-row[data-style="tech"] .style-name { color: #0891b2; }
  html[data-theme="dark"] .style-row[data-style="tech"] .style-name { color: #6ff4ff; }
  .style-row[data-style="warm"] .style-name { color: #8a4517; }
  html[data-theme="dark"] .style-row[data-style="warm"] .style-name { color: #f0b27a; }

  /* 轻量提示条 */
  #toast {
    position: absolute; z-index: 70; left: 50%; bottom: var(--s-4);
    transform: translateX(-50%) translateY(8px);
    padding: 7px var(--s-3); border-radius: var(--r-sm);
    background: var(--ink-900); color: var(--ink-25);
    font-size: var(--fs-sm); font-weight: var(--fw-semibold); white-space: nowrap;
    box-shadow: var(--e-3);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-normal) var(--ease-out);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  html[data-theme="dark"] #toast { background: var(--ink-25); color: var(--ink-900); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.16); border-radius: var(--r-pill); }
  html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); }

  /* 减弱动效：展开/收起与 chevron 旋转退化为瞬时，避免前庭不适用户看到大幅位移 */
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div id="card">
    <div id="head">
      <span class="title">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <circle cx="8.5" cy="8.5" r="1.4"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
        皮肤设置
      </span>
      <button id="btnClose" title="关闭" aria-label="关闭">✕</button>
    </div>

    <!-- 主视图：仅两个入口（原生皮肤 / 自选图片），无任何 per-surface 控件 -->
    <div id="body">
      <!-- 入口 ①：原生皮肤 —— 点击动画展开/收起 #nativeList -->
      <button id="entryNative" class="entry" aria-expanded="false" aria-controls="nativeList">
        <span class="entry-main">
          <svg class="entry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 3l2.4 5.3 5.6.6-4.2 3.8 1.2 5.6L12 15.8 6.9 18.3 8.1 12.7 4 8.9l5.6-.6L12 3z"></path>
          </svg>
          原生皮肤
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"></path>
        </svg>
      </button>

      <!-- 6 行原生风格：每行左侧一枚该风格真实观感的迷你预览条，右侧风格名 -->
      <div id="nativeList" class="native-list" aria-hidden="true">
        <button class="style-row" data-style="default" aria-pressed="false">
          <span class="pv pv-default" aria-hidden="true"></span>
          <span class="style-name">默认</span>
        </button>
        <button class="style-row" data-style="minimal" aria-pressed="false">
          <span class="pv pv-minimal" aria-hidden="true"></span>
          <span class="style-name">极简</span>
        </button>
        <button class="style-row" data-style="glass" aria-pressed="false">
          <span class="pv pv-glass" aria-hidden="true"></span>
          <span class="style-name">玻璃拟态</span>
        </button>
        <button class="style-row" data-style="neu" aria-pressed="false">
          <span class="pv pv-neu" aria-hidden="true"></span>
          <span class="style-name">新拟态</span>
        </button>
        <button class="style-row" data-style="tech" aria-pressed="false">
          <span class="pv pv-tech" aria-hidden="true"></span>
          <span class="style-name">科技感</span>
        </button>
        <button class="style-row" data-style="warm" aria-pressed="false">
          <span class="pv pv-warm" aria-hidden="true"></span>
          <span class="style-name">温润拟物</span>
        </button>
      </div>

      <!-- 入口 ②：自选图片 —— 点击开独立新窗口（主进程 open-custom 负责创建） -->
      <button id="entryCustom" class="entry">
        <span class="entry-main">
          <svg class="entry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <circle cx="8.5" cy="8.5" r="1.4"></circle>
            <path d="M21 15l-5-5L5 21"></path>
          </svg>
          自选图片
        </span>
      </button>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      'use strict';
      var api = window.api;
      var params = new URLSearchParams(location.search);
      if (params.get('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

      /* 只有一个共享状态：主进程下发的 skin / resolved。本窗不再有「当前编辑界面」概念。 */
      var S = { skin: null, resolved: null };

      /* 展开态：用 JS 变量镜像 DOM 的 .open / aria-expanded，供 Esc 逻辑判断 */
      var nativeOpen = false;

      function $(id) { return document.getElementById(id); }

      /* ---- toast（保留：用于 API 缺失等异常反馈）---- */
      var toastTimer = null;
      function toast(msg) {
        var el = $('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove('show'); toastTimer = null; }, 2200);
      }

      /* ---- 原生风格列表展开/收起 ----
       * 为什么用 class 切换而非 JS 直接量高动画：交给 CSS transition 处理（见 .native-list），
       * JS 只负责状态翻转与 aria 同步，逻辑最薄、最不容易出错。 */
      function setNativeOpen(open) {
        nativeOpen = !!open;
        var list = $('nativeList');
        var entry = $('entryNative');
        if (list) {
          list.classList.toggle('open', nativeOpen);
          list.setAttribute('aria-hidden', nativeOpen ? 'false' : 'true');
        }
        if (entry) entry.setAttribute('aria-expanded', nativeOpen ? 'true' : 'false');
      }

      /* ---- 高亮回显（唯一真相来自主进程 skin-config-state）----
       * 规则（契约 C3）：
       *   某风格行 .active ⇔ resolved.calendar.style === X 且 resolved.calendar.bg === 'native'；
       *   「自选图片」入口 .active ⇔ 4 个面中任一 face.bg === 'image'（表示当前有自选图片在用）。 */
      function render() {
        if (!S.skin) return;
        var rc = (S.resolved && S.resolved.calendar) ? S.resolved.calendar : null;

        /* 主题回显：本窗自身跟随基准主题（resolved.calendar.theme） */
        document.documentElement.setAttribute('data-theme', (rc && rc.theme === 'dark') ? 'dark' : 'light');

        /* 生效的原生风格：仅当日历面 bg=native 时才有「当前风格」，否则不高亮任何行 */
        var activeStyle = (rc && rc.bg === 'native') ? (rc.style || 'default') : null;
        var rows = document.querySelectorAll('#nativeList .style-row[data-style]');
        for (var i = 0; i < rows.length; i++) {
          var on = !!activeStyle && rows[i].getAttribute('data-style') === activeStyle;
          rows[i].classList.toggle('active', on);
          rows[i].setAttribute('aria-pressed', on ? 'true' : 'false');
        }

        /* 「自选图片」入口：任一面用了图片背景即点亮 */
        var surfaces = (S.skin && S.skin.surfaces) ? S.skin.surfaces : {};
        var names = ['calendar', 'expanded', 'desktop', 'dock'];
        var hasImage = false;
        for (var k = 0; k < names.length; k++) {
          var c = surfaces[names[k]];
          if (c && c.bg === 'image') { hasImage = true; break; }
        }
        var entryCustom = $('entryCustom');
        if (entryCustom) entryCustom.classList.toggle('active', hasImage);
      }

      /* ---- 事件绑定 ---- */
      // 入口 ①：点「原生皮肤」→ 展开/收起列表
      $('entryNative').addEventListener('click', function () { setNativeOpen(!nativeOpen); });

      // 6 风格行：点击 → 主进程原子写 4 个面（契约 C1，非 skinSet）
      var styleBtns = document.querySelectorAll('#nativeList .style-row[data-style]');
      for (var j = 0; j < styleBtns.length; j++) {
        (function (b) {
          b.addEventListener('click', function () {
            if (api && api.skinAction) api.skinAction('apply-native-style', { style: b.getAttribute('data-style') });
          });
        })(styleBtns[j]);
      }

      // 入口 ②：点「自选图片」→ 请求主进程开独立新窗口（surface 默认 calendar）
      $('entryCustom').addEventListener('click', function () {
        if (api && api.skinAction) api.skinAction('open-custom', { surface: 'calendar' });
      });

      // 关闭：先收起展开，再关窗
      function closeWin() {
        if (api && api.skinAction) api.skinAction('close');
        setTimeout(function () { window.close(); }, 60);
      }
      $('btnClose').addEventListener('click', closeWin);
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if (nativeOpen) { setNativeOpen(false); return; }
        closeWin();
      });

      /* 订阅主进程推送的皮肤配置（唯一真相） */
      if (api && api.onSkinConfigState) {
        api.onSkinConfigState(function (state) {
          if (!state) return;
          S.skin = state.skin;
          S.resolved = state.resolved;
          render();
        });
      }

      /* 首帧渲染：若主进程尚未推送，先按缺省主题出图（避免空白） */
      render();
    })();
  </script>
</body>
</html>
