<title>简洁桌面日历</title>
<style>
  /* ==========================================================================
   * 简洁桌面日历 · 设计系统 v2.0（UI Design System）
   * --------------------------------------------------------------------------
   * 设计语言：「纸与光」—— 东方的暖纸质地 + 雅蓝墨色 + 朱砂点睛。
   * 全部视觉决策收敛到本文件顶部的 Token；任何组件不得硬编码色值/圆角/阴影。
   *
   * 三层尺度：
   *   L1 基础层  —— 色板 / 字阶 / 间距 / 圆角 / 阴影 / 动效
   *   L2 语义层  —— surface / ink / accent / state（由基础层派生，随主题切换）
   *   L3 组件层  —— 只消费 L2 语义变量
   * ========================================================================== */

  /* ============================ L1 基础层 ============================ */
  :root {
    /* ---------- 色板：中性（暖纸/墨） ---------- */
    --ink-900: #14181f;
    --ink-800: #1f2430;   /* 主文字 */
    --ink-700: #333a48;
    --ink-600: #4b5563;
    --ink-500: #6b7280;   /* 次要文字 */
    --ink-400: #9aa1ad;   /* 弱化文字 */
    --ink-300: #c2c8d2;   /* 描边强 */
    --ink-200: #e2e6ec;   /* 描边 */
    --ink-100: #f0f2f5;   /* 填充微 */
    --ink-50:  #f7f8fa;
    --ink-25:  #fcfbf9;   /* 纸白 */

    /* ---------- 色板：雅蓝（主色 / 选中 / 今日） ---------- */
    --blue-50:  #eff4fc;
    --blue-100: #dae6fa;
    --blue-200: #b9cff5;
    --blue-300: #8fb0ec;
    --blue-400: #6389df;
    --blue-500: #3b6fd4;   /* accent 主色 */
    --blue-600: #1976d2;   /* 今日格（用户已确认的蓝） */
    --blue-700: #155ba6;
    --blue-800: #10457e;
    --blue-900: #0c3056;

    /* ---------- 色板：朱砂（节假日 / 危险） ---------- */
    --red-50:  #fdf0ef;
    --red-100: #fbdcd9;
    --red-200: #f6bab4;
    --red-300: #ee9187;
    --red-400: #e46659;
    --red-500: #d6453f;
    --red-600: #bf3330;
    --red-700: #9a2826;

    /* ---------- 色板：琥珀（特别关注） ---------- */
    --amber-50:  #fff8e6;
    --amber-100: #ffeccc;
    --amber-200: #ffd98a;
    --amber-300: #ffc857;
    --amber-400: #ffb020;
    --amber-500: #f59e0b;
    --amber-600: #b26500;
    --amber-700: #8a4d00;

    /* ---------- 色板：青竹（日期区间选择） ---------- */
    --green-50:  #eafbf0;
    --green-100: #d0f5e0;
    --green-200: #a5eac5;
    --green-300: #6ddba4;
    --green-400: #34c76f;
    --green-500: #22c55e;
    --green-600: #16a34a;
    --green-700: #15803d;
    --green-800: #166534;

    /* ---------- 字阶（14 级，覆盖 mini / expanded 两套密度） ---------- */
    --fs-3xs: 8px;    /* 角标 chip / 星期头 / 农历副标 */
    --fs-2xs: 9px;    /* 微标签 / 开关字 / 今日按钮 */
    --fs-xs:  10px;   /* 辅助文字 */
    --fs-sm:  11px;   /* 正文小 / 输入 / 提示条 */
    --fs-md:  13px;   /* 按钮文字 / 弹窗正文 */
    --fs-lg:  14px;   /* 日历单元格数字（mini） */
    --fs-xl:  15px;   /* 弹窗小标题 / 提醒标题 */
    --fs-2xl: 17px;   /* 挂件时钟 */
    --fs-3xl: 18px;   /* 放大模式星期头 */
    --fs-4xl: 20px;   /* 放大模式农历 */
    --fs-5xl: 24px;   /* 放大模式日期 */
    --fs-6xl: 30px;   /* mini 主时钟 */
    --fs-7xl: 42px;   /* 放大模式单元格数字 */
    --fs-8xl: 76px;   /* 放大模式主时钟 */

    --fw-regular: 400;
    --fw-medium:  500;
    --fw-semibold: 600;
    --fw-bold:    700;

    /* ---------- 字体栈 ---------- */
    --font-sans: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI",
                 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
                 "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    --font-num-feat: "tnum" 1, "lnum" 1, "ss01" 1;

    /* ---------- 间距（4pt 网格） ---------- */
    --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;
    --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;

    /* ---------- 圆角（5 级） ---------- */
    --r-xs: 4px;    /* 角标 */
    --r-sm: 6px;    /* 按钮 / 输入框 */
    --r-md: 10px;   /* 单元格 / 弹层 */
    --r-lg: 14px;   /* 卡片（mini） */
    --r-xl: 24px;   /* 卡片（expanded） */
    --r-pill: 999px;

    /* ---------- 动效 ---------- */
    --dur-instant: 80ms;
    --dur-fast:    140ms;
    --dur-normal:  220ms;
    --dur-slow:    340ms;
    --ease-out:    cubic-bezier(.22, .61, .36, 1);
    --ease-in-out: cubic-bezier(.4, 0, .2, 1);
    --ease-spring: cubic-bezier(.34, 1.46, .64, 1);

    /* ---------- 模糊 ---------- */
    --blur-card: 18px;
    --blur-pop:  24px;

    /* ========== L2 语义层 · 白日（Warm Paper） ========== */
    /* v3.4.0【用户选定：面板默认完全不透明】中性 --paper 四档 → rgb(…)（无 alpha 段）：
     *   ① 为何完全不透明：这是**用户拍板的最终选择**（用户原话「確定 1.00 版本」，经 lead 转达）；
     *      0.95 只是先前「对齐浮窗卡面」的中间档 —— 主窗比浮窗更实，是用户的取舍。
     *      注意：浮窗卡面 dock.html 仍为 0.95，本次**只改主窗、不动浮窗**。
     *   ② 为何安全：`--paper` 全仓唯一消费者是 `#widget { background: var(--paper) }`，
     *      且只在 native 态生效（[data-skin="color"]/[data-skin="image"] 已分别改写 #widget 背景，
     *      app.js 在 native 态 delete root.dataset.skin）⇒ 结构上不可能影响图片/动图/纯色皮肤。
     *   ③ 附带事实：完全不透明后 `#widget` 的 `backdrop-filter`（:733-734）对 native 态观感贡献≈0，
     *      但它同时决定圆角/描边观感，故**保留不动**（删它属越界）。
     *   四处中性档同步改（:root 白/夜 + default 白/夜）；刻意材质档
     *   （minimal/glass/neu/tech/warm）一律不动 —— 那些是设计材质，不是缺陷。 */
    --paper: rgb(252, 251, 249);
    --paper-solid: #fcfbf9;
    --paper-edge: rgba(31, 35, 48, 0.14);   /* v2.3.2 由 9% 加深：修灰色工具栏左右两端被半透明描边衬成白边 */
    --paper-hi: rgba(255, 255, 255, 0.70);       /* 顶部高光 */

    --ink: var(--ink-800);
    --ink-soft: var(--ink-500);
    --ink-faint: var(--ink-400);

    /* ========== v2.4.0 第二轮 皮肤层（独立背景 + 自动明暗文字） ==========
     * 主进程是唯一真相：背景类型 / 生效明暗 / 图片取景都在主进程算好，渲染层只应用。
     * --skin-bg-solid 仅由 JS 写入，[data-skin="color"] 才生效；文字明暗由 data-theme 全量驱动。 */
    --skin-bg-solid: transparent;
    /* v2.4.4 自选纯色/图片皮肤：三层可读性变量（局部保护遮罩 + 文字光晕 + 兜底描边）。
     * 由 app.js applyClarity 按文字明暗 + clarity(0~100) 写入；原生皮肤不写，保持透明/无光晕。 */
    --stroke-color: transparent;
    --ink-glow: 0 0 0 transparent;
    --protect-top: transparent;
    --protect-mid: transparent;
    --protect-bot: transparent;
    --protect-edge: transparent;
    --protect-state: transparent;

    --accent: var(--blue-500);
    --accent-strong: var(--blue-600);            /* 今日 */
    --accent-soft: rgba(59, 111, 212, 0.10);
    --accent-softer: rgba(59, 111, 212, 0.06);
    --accent-line: rgba(59, 111, 212, 0.42);
    --accent-ink: var(--blue-700);
    --accent-glow: rgba(59, 111, 212, 0.26);
    /* v3.4.0：今日格「半透明填充」的不透明度（原生档 html:not([data-skin]) + 自选图片/动图档
     * html[data-skin="image"] 共用；均在 L3 组件层 .cell.today 消费）。
     * 抽成变量而非把数值写死在规则里：便于统一切档验收，不必改规则本身。
     * v3.4.0 第 2 轮：用户要求「今日的颜色再透明一点点」⇒ 80% → 68%。 */
    --today-fill-alpha: 68%;

    --cinnabar: var(--red-500);
    --cinnabar-soft: rgba(214, 69, 63, 0.075);
    --cinnabar-line: rgba(214, 69, 63, 0.40);
    --holiday-fg: var(--red-600);

    --focus-amber: var(--amber-500);
    --focus-soft: rgba(245, 158, 11, 0.20);
    --focus-line: rgba(245, 158, 11, 0.62);
    --focus-ink: var(--amber-600);

    --range: var(--green-500);
    --range-soft: rgba(34, 197, 94, 0.20);
    --range-softer: rgba(34, 197, 94, 0.15);
    --range-line: rgba(34, 197, 94, 0.75);
    --range-ink: var(--green-700);

    --weekend: var(--red-500);
    --workday: var(--blue-500);

    --ctl-bg: #ffffff;                            /* 控件底 */
    --ctl-bg-hover: rgba(31, 35, 48, 0.05);
    --ctl-edge: rgba(31, 35, 48, 0.10);
    --hover-wash: rgba(31, 35, 48, 0.045);
    --cell-hover: rgba(255, 255, 255, 0.90);
    --cell-hover-line: rgba(31, 35, 48, 0.42);
    --watermark: rgba(31, 35, 48, 0.13);
    --scrim: rgba(31, 35, 48, 0.92);              /* toast / dayCount */

    /* ---------- 阴影（5 级 elevation） ---------- */
    --e-1: 0 1px 2px rgba(31, 35, 48, 0.06), 0 0 0 1px rgba(31, 35, 48, 0.045);
    --e-2: 0 2px 8px rgba(31, 35, 48, 0.08),  0 0 0 1px rgba(31, 35, 48, 0.05);
    --e-3: 0 10px 28px rgba(31, 35, 48, 0.14), 0 2px 6px rgba(31, 35, 48, 0.06),
           inset 0 1px 0 rgba(255, 255, 255, 0.55);
    --e-4: 0 18px 44px rgba(31, 35, 48, 0.16), 0 4px 12px rgba(31, 35, 48, 0.07),
           inset 0 1px 0 rgba(255, 255, 255, 0.65);
    --e-5: 0 32px 80px rgba(31, 35, 48, 0.22), 0 8px 20px rgba(31, 35, 48, 0.10),
           inset 0 1px 0 rgba(255, 255, 255, 0.70);
    --shadow-soft: var(--e-4);
  }

  /* ========== L2 语义层 · 黑夜（Deep Ink 深墨蓝） ==========
   * 原则：不做纯反色。降低整体对比（纯白文字在深底上刺眼），
   *       阴影 alpha 提高约 2 倍改用纯黑，内高光保留但极弱。 */
  [data-theme="dark"] {
    --paper: rgb(28, 32, 44);   /* v3.4.0 中性纸面改为完全不透明（理由见 :root 白日档注释） */
    --paper-solid: #1c202c;
    --paper-edge: rgba(255, 255, 255, 0.08);
    --paper-hi: rgba(255, 255, 255, 0.06);

    --ink: #e8eaf0;
    --ink-soft: #9aa3b3;
    --ink-faint: #6a7283;

    --accent: #6b9bff;
    --accent-strong: #4a86ef;                    /* 今日（黑夜降饱和、提亮） */
    --accent-soft: rgba(107, 155, 255, 0.16);
    --accent-softer: rgba(107, 155, 255, 0.09);
    --accent-line: rgba(107, 155, 255, 0.52);
    --accent-ink: #a8c4ff;
    --accent-glow: rgba(107, 155, 255, 0.30);

    --cinnabar: #ef6b65;
    --cinnabar-soft: rgba(239, 107, 101, 0.17);
    --cinnabar-line: rgba(239, 107, 101, 0.48);
    --holiday-fg: #f08b86;

    --focus-amber: #ffc857;
    --focus-soft: rgba(255, 200, 87, 0.18);
    --focus-line: rgba(255, 200, 87, 0.55);
    --focus-ink: #ffc857;

    --range: #4ade80;
    --range-soft: rgba(34, 197, 94, 0.26);
    --range-softer: rgba(34, 197, 94, 0.19);
    --range-line: rgba(34, 197, 94, 0.70);
    --range-ink: #86efac;

    --weekend: #f08b86;
    --workday: #6b9bff;

    --ctl-bg: rgba(255, 255, 255, 0.07);
    --ctl-bg-hover: rgba(255, 255, 255, 0.12);
    --ctl-edge: rgba(255, 255, 255, 0.10);
    --hover-wash: rgba(255, 255, 255, 0.055);
    --cell-hover: rgba(255, 255, 255, 0.13);
    --cell-hover-line: rgba(255, 255, 255, 0.22);
    --watermark: rgba(255, 255, 255, 0.055);
    --scrim: rgba(238, 241, 246, 0.94);

    --e-1: 0 1px 2px rgba(0, 0, 0, 0.30), 0 0 0 1px rgba(255, 255, 255, 0.05);
    --e-2: 0 2px 8px rgba(0, 0, 0, 0.38),  0 0 0 1px rgba(255, 255, 255, 0.06);
    --e-3: 0 12px 32px rgba(0, 0, 0, 0.56), 0 2px 8px rgba(0, 0, 0, 0.34),
           inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --e-4: 0 20px 48px rgba(0, 0, 0, 0.62), 0 4px 14px rgba(0, 0, 0, 0.38),
           inset 0 1px 0 rgba(255, 255, 255, 0.07);
    --e-5: 0 36px 88px rgba(0, 0, 0, 0.70), 0 10px 24px rgba(0, 0, 0, 0.44),
           inset 0 1px 0 rgba(255, 255, 255, 0.08);
    --shadow-soft: var(--e-4);
  }

  /* ==========================================================================
   * v3.0.0 §7 六套「风格」token（风格驱动，叠加在 [data-theme] 之上）
   * --------------------------------------------------------------------------
   * 三轴解耦（§12）：data-theme=背景明暗、data-style=风格材质、data-text=文字轴。
   * 本段只写「风格相关」变量（表面/材质/圆角/阴影/强调/状态明度/字体/动效）。
   * 明暗两档各自独立成块：浅档 [data-theme="light"][data-style="X"]、
   * 深档 [data-theme="dark"][data-style="X"]（特异性同为 (0,2,0)，互不越界，
   * 避免「浅档 token 反压深底」）。状态色守恒：休/异/周末=红、上班=绿/青、
   * 特别关注=琥珀，仅调明度饱和度不改色相（§8.3）。
   * 注：default 档沿用既有 :root / [data-theme="dark"] 取值，不改视觉（避免回归）。
   * ========================================================================== */

  /* ---------- ① 默认（融合）：轻玻璃 18px + 中性双色强调 ---------- */
  [data-theme="light"][data-style="default"] {
    --paper: rgb(252, 251, 249);   /* v3.4.0 中性纸面改为完全不透明（理由见 :root 白日档注释） */
    --paper-solid: #fcfbf9;
    --paper-edge: rgba(31, 35, 48, 0.12);
    --paper-hi: rgba(255, 255, 255, 0.74);
    --ink: #1f2430; --ink-soft: #4b5563; --ink-faint: #9aa1ad;
    --accent: #3b6fd4; --accent-strong: #1976d2;
    --accent-soft: rgba(59, 111, 212, 0.10); --accent-ink: #155ba6;
    --accent-line: rgba(59, 111, 212, 0.42); --accent-glow: rgba(59, 111, 212, 0.26);
    --weekend: #d6453f; --holiday-fg: #bf3330; --cinnabar: #d6453f;
    --workday: #3b6fd4; --focus-amber: #f59e0b;
    /* v3.1.0：中性融合档——把层级做干净（顶部高光 + 中景投影 + 远景环境影三层） */
    --r-lg: 16px; --blur-card: 20px;
    --e-4: 0 1px 0 rgba(255, 255, 255, 0.72) inset,
           0 14px 34px rgba(31, 35, 48, 0.14), 0 3px 10px rgba(31, 35, 48, 0.06);
    --shadow-soft: var(--e-4);
  }
  [data-theme="dark"][data-style="default"] {
    --paper: rgb(28, 32, 44);   /* v3.4.0 中性纸面改为完全不透明（理由见 :root 白日档注释） */
    --paper-solid: #1c202c;
    --paper-edge: rgba(255, 255, 255, 0.09);
    --paper-hi: rgba(255, 255, 255, 0.07);
    --ink: #e8eaf0; --ink-soft: #9aa3b3; --ink-faint: #6a7283;
    --accent: #6b9bff; --accent-strong: #4a86ef;
    --accent-soft: rgba(107, 155, 255, 0.16); --accent-ink: #a8c4ff;
    --accent-line: rgba(107, 155, 255, 0.52); --accent-glow: rgba(107, 155, 255, 0.30);
    --weekend: #f08b86; --holiday-fg: #f08b86; --cinnabar: #ef6b65;
    --workday: #6b9bff; --focus-amber: #ffc857;
    --r-lg: 16px; --blur-card: 20px;
    --e-4: 0 1px 0 rgba(255, 255, 255, 0.06) inset,
           0 18px 44px rgba(0, 0, 0, 0.58), 0 4px 14px rgba(0, 0, 0, 0.34);
    --shadow-soft: var(--e-4);
  }

  /* ---------- ② 极简：大量留白 + 极细线 + 近黑强调（无模糊） ---------- */
  [data-theme="light"][data-style="minimal"] {
    --paper: #ffffff; --paper-solid: #ffffff;
    --paper-edge: #ececef; --paper-hi: rgba(255, 255, 255, 0.90);
    --ink: #16171a; --ink-soft: #3f4046; --ink-faint: #a1a1aa;
    --accent: #16171a; --accent-strong: #16171a;
    --accent-soft: rgba(22, 23, 26, 0.08); --accent-ink: #16171a;
    --accent-line: rgba(22, 23, 26, 0.30); --accent-glow: rgba(22, 23, 26, 0.16);
    --weekend: #ef4444; --holiday-fg: #ef4444; --cinnabar: #ef4444;
    --workday: #15803d; --focus-amber: #f59e0b;
    /* v3.1.0：极致克制——更大的圆角留白 + 只有一层极细的环境影 */
    --r-lg: 18px; --blur-card: 0px;
    --dur-fast: 120ms; --dur-normal: 200ms; --dur-slow: 300ms;
    --e-4: 0 1px 2px rgba(16, 24, 40, 0.05), 0 14px 32px rgba(16, 24, 40, 0.07);
    --shadow-soft: var(--e-4);
  }
  [data-theme="dark"][data-style="minimal"] {
    --paper: #161619; --paper-solid: #161619;
    --paper-edge: rgba(255, 255, 255, 0.12); --paper-hi: rgba(255, 255, 255, 0.05);
    --ink: #f4f4f5; --ink-soft: #c4c4c8; --ink-faint: #8a8a90;
    --accent: #f4f4f5; --accent-strong: #f4f4f5;
    --accent-soft: rgba(244, 244, 245, 0.10); --accent-ink: #ffffff;
    --accent-line: rgba(244, 244, 245, 0.34); --accent-glow: rgba(244, 244, 245, 0.18);
    --weekend: #f87171; --holiday-fg: #f87171; --cinnabar: #f87171;
    --workday: #4ade80; --focus-amber: #fbbf24;
    --r-lg: 18px; --blur-card: 0px;
    --dur-fast: 120ms; --dur-normal: 200ms; --dur-slow: 300ms;
    --e-4: 0 1px 2px rgba(0, 0, 0, 0.40), 0 20px 48px rgba(0, 0, 0, 0.55);
    --shadow-soft: var(--e-4);
  }

  /* ---------- ③ 玻璃拟态：磨砂 + 强模糊 + 高光描边 + 彩色光斑 ---------- */
  [data-theme="light"][data-style="glass"] {
    --paper: rgba(255, 255, 255, 0.42); --paper-solid: #ffffff;
    --paper-edge: rgba(255, 255, 255, 0.80); --paper-hi: rgba(255, 255, 255, 0.88);
    --ink: #21263a; --ink-soft: #3d4658; --ink-faint: #6a7385;
    --accent: #7c6bff; --accent-strong: #7c6bff;
    --accent-soft: rgba(124, 107, 255, 0.16); --accent-ink: #5a4be0;
    --accent-line: rgba(124, 107, 255, 0.46); --accent-glow: rgba(124, 107, 255, 0.32);
    --weekend: #ff6fc4; --holiday-fg: #ff6fc4; --cinnabar: #ff6fc4;
    --workday: #3fd6a0; --focus-amber: #ffc24b;
    --r-lg: 24px; --blur-card: 26px;
    --dur-fast: 160ms; --dur-normal: 240ms; --dur-slow: 360ms;
    --e-4: inset 0 1px 0 rgba(255, 255, 255, 0.85), inset 0 -1px 0 rgba(255, 255, 255, 0.22),
          0 22px 56px rgba(18, 8, 58, 0.26);
    --e-5: inset 0 1px 0 rgba(255, 255, 255, 0.90), 0 34px 84px rgba(18, 8, 58, 0.34);
    --shadow-soft: var(--e-4);
    /* C10：无桌面像素可糊 → 页面自绘光斑 + 分层假磨砂（浅色档=明亮通透的彩色光斑） */
    /* v3.1.0 返工(缺陷3)：白洗 .62→.34 让光泽带有对比对象；光斑"远"（半径放大、alpha 降低）不再盖过玻璃味 */
    --glass-sheen-a: rgba(255, 255, 255, 0.34);
    --glass-sheen-b: rgba(255, 255, 255, 0.14);
    --glass-edge: rgba(255, 255, 255, 0.85);
    --glass-veil:
      radial-gradient(300px 300px at 14% 16%, rgba(255, 150, 214, 0.55), transparent 72%),
      radial-gradient(360px 360px at 88% 12%, rgba(140, 124, 255, 0.46), transparent 74%),
      radial-gradient(420px 420px at 68% 100%, rgba(80, 200, 255, 0.42), transparent 72%),
      linear-gradient(150deg, #eef0ff, #e7ecff 58%, #f2ecff);
  }
  [data-theme="dark"][data-style="glass"] {
    --paper: rgba(30, 20, 60, 0.38); --paper-solid: #1e143c;
    --paper-edge: rgba(255, 255, 255, 0.42); --paper-hi: rgba(255, 255, 255, 0.16);
    --ink: #ffffff; --ink-soft: rgba(255, 255, 255, 0.74); --ink-faint: rgba(255, 255, 255, 0.52);
    --accent: #9d8cff; --accent-strong: #9d8cff;
    --accent-soft: rgba(157, 140, 255, 0.22); --accent-ink: #c6bcff;
    --accent-line: rgba(157, 140, 255, 0.52); --accent-glow: rgba(157, 140, 255, 0.34);
    --weekend: #ff9ccf; --holiday-fg: #ff9ccf; --cinnabar: #ff9ccf;
    --workday: #57e0b0; --focus-amber: #ffc24b;
    --r-lg: 24px; --blur-card: 26px;
    --dur-fast: 160ms; --dur-normal: 240ms; --dur-slow: 360ms;
    --e-4: inset 0 1px 0 rgba(255, 255, 255, 0.50), inset 0 -1px 0 rgba(255, 255, 255, 0.14),
          0 26px 66px rgba(0, 0, 0, 0.55);
    --e-5: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 38px 96px rgba(0, 0, 0, 0.62);
    --shadow-soft: var(--e-4);
    /* C10：无桌面像素可糊 → 页面自绘光斑 + 分层假磨砂（深色档=彩色光斑从暗紫底透出） */
    /* v3.1.0 返工(缺陷3)：白洗 .30→.20；光斑"远"（半径放大、alpha 降低） */
    --glass-sheen-a: rgba(255, 255, 255, 0.20);
    --glass-sheen-b: rgba(255, 255, 255, 0.05);
    --glass-edge: rgba(255, 255, 255, 0.48);
    --glass-veil:
      radial-gradient(300px 300px at 14% 16%, rgba(255, 122, 200, 0.60), transparent 72%),
      radial-gradient(360px 360px at 88% 12%, rgba(124, 107, 255, 0.62), transparent 74%),
      radial-gradient(420px 420px at 68% 100%, rgba(47, 198, 255, 0.56), transparent 72%),
      linear-gradient(150deg, #2a1d52, #0e1132 58%, #1d1546);

  /* glass 专属：保留 backdrop-filter（对窗口内元素仍有真实作用），仅提升饱和度。
   * 注意：这**不是**主要手段——真正"像玻璃"靠上面的自绘光斑 + 分层假磨砂（C10）。 */
  html[data-style="glass"] #widget {
    -webkit-backdrop-filter: blur(26px) saturate(2.2);
    backdrop-filter: blur(26px) saturate(2.2);
  }

  /* ---------- ④ 新拟态：同色系双向阴影，柔和低对比（配 clarity 兜底） ---------- */
  [data-theme="light"][data-style="neu"] {
    --paper: #dfe6f0; --paper-solid: #dfe6f0;
    --paper-edge: #ffffff; --paper-hi: rgba(255, 255, 255, 0.72);

    /* v3.1.0 返工(缺陷2)：双向阴影明暗差拉大（#b9c4d6 vs #fff ≈45 级明度），并抽出内嵌控件用的双向色 */
    --r-lg: 28px; --blur-card: 0px;

    --neu-dark: #b9c4d6; --neu-light: #ffffff;
    --e-4: 15px 15px 32px var(--neu-dark), -15px -15px 32px var(--neu-light);
    --e-5: 22px 22px 46px var(--neu-dark), -22px -22px 46px var(--neu-light);

  [data-theme="dark"][data-style="neu"] {
    --paper: #232a36; --paper-solid: #232a36;
    --paper-edge: #151a22; --paper-hi: rgba(255, 255, 255, 0.05);
    --ink: #c7ced9; --ink-soft: #9aa3b3; --ink-faint: #6a7283;
    --accent: #6fb0d8; --accent-strong: #6fb0d8;
    --accent-soft: rgba(111, 176, 216, 0.18); --accent-ink: #8fc6e8;
    --accent-line: rgba(111, 176, 216, 0.46); --accent-glow: rgba(111, 176, 216, 0.30);
    --weekend: #e08983; --holiday-fg: #e08983; --cinnabar: #e08983;
    --workday: #6fb79a; --focus-amber: #e0a856;
    --r-lg: 28px; --blur-card: 0px;
    --dur-fast: 180ms; --dur-normal: 260ms; --dur-slow: 380ms;
    /* 深档：亮侧 #323c4c→#3a4658 拉开层次（暗侧 #141920 已够） */
    --neu-dark: #141920; --neu-light: #3a4658;
    --e-4: 15px 15px 32px var(--neu-dark), -15px -15px 32px var(--neu-light);
    --e-5: 22px 22px 46px var(--neu-dark), -22px -22px 46px var(--neu-light);

  }

  /* ---------- ⑤ 科技感：深底 + 青蓝霓虹 + 网格 + 等宽字（nativeTheme=dark） ---------- */
  [data-theme="light"][data-style="tech"] {
    /* v3.1.0：日间 HUD —— 浅青渐变底 + 青色网格 + 深青文字 + 同样的切角语言 */
    /* v3.1.0 返工(缺陷1)：浅档强度对齐深档——网格/双霓虹/文字光/描边全部加强，不再"退化成白卡" */
    --paper: #eef7fb; --paper-solid: #eef7fb;
    --paper-edge: rgba(8, 145, 178, 0.55); --paper-hi: rgba(255, 255, 255, 0.72);
    --ink: #06333d; --ink-soft: #0d5a6b; --ink-faint: #4a8595;
    --accent: #06b6d4; --accent-strong: #06b6d4;
    --accent-soft: rgba(6, 182, 212, 0.16); --accent-ink: #0e7490;
    --accent-line: rgba(6, 182, 212, 0.50); --accent-glow: rgba(6, 182, 212, 0.34);
    /* 状态色相守恒：周末/节假日=红、上班=绿/青、特别关注=琥珀（只调明度饱和度） */
    --weekend: #d92b45; --holiday-fg: #c81e3a; --cinnabar: #d92b45;
    --workday: #0e9f6e; --focus-amber: #c98a12;
    --r-lg: 10px; --blur-card: 0px;
    --dur-fast: 100ms; --dur-normal: 180ms; --dur-slow: 260ms;
    --font-sans: "Cascadia Code", "Consolas", ui-monospace, "JetBrains Mono", monospace;
    --e-4: 0 0 28px rgba(6, 182, 212, 0.30), inset 0 0 32px rgba(6, 182, 212, 0.14);
    --e-5: 0 0 44px rgba(6, 182, 212, 0.34), inset 0 0 42px rgba(6, 182, 212, 0.16);
    --shadow-soft: var(--e-4);
    /* tech 专属：青色网格（.24，浅底需更高 alpha 才可见）+ 双霓虹光晕（品红仅装饰）+ 文字微发光 + 渐变态底 */
    --tech-grid: rgba(8, 145, 178, 0.24);
    --tech-glow-a: rgba(8, 145, 178, 0.48);
    --tech-glow-b: rgba(217, 43, 110, 0.34);
    --tech-ink-glow: 0 0 10px rgba(8, 145, 178, 0.55);
    --tech-veil:
      radial-gradient(90% 70% at 12% 6%, rgba(255, 255, 255, 0.55), transparent 60%),
      linear-gradient(160deg, #e8f7fe, #d8ecf7 58%, #cfe6f4);
  }
  [data-theme="dark"][data-style="tech"] {
    /* v3.1.0：赛博朋克 —— 近黑蓝底 + 青(#22d3ee)与品红(#f0f)双霓虹（品红仅装饰） */
    --paper: #060a12; --paper-solid: #04070d;
    --paper-edge: rgba(34, 211, 238, 0.55); --paper-hi: rgba(34, 211, 238, 0.10);
    --ink: #b8f7ff; --ink-soft: rgba(150, 240, 255, 0.74); --ink-faint: rgba(120, 220, 245, 0.42);
    --accent: #22d3ee; --accent-strong: #22d3ee;
    --accent-soft: rgba(34, 211, 238, 0.20); --accent-ink: #6ff4ff;
    --accent-line: rgba(34, 211, 238, 0.60); --accent-glow: rgba(34, 211, 238, 0.48);
    /* 状态色相守恒：周末/节假日=霓虹红（色相不换），上班=青绿，特别关注=琥珀 */
    --weekend: #ff5c6c; --holiday-fg: #ff5c6c; --cinnabar: #ff5c6c;
    --workday: #2ee6a6; --focus-amber: #ffcf5c;
    --r-lg: 10px; --blur-card: 0px;
    --dur-fast: 100ms; --dur-normal: 180ms; --dur-slow: 260ms;
    --font-sans: "Cascadia Code", "Consolas", ui-monospace, "JetBrains Mono", monospace;
    --e-4: 0 0 30px rgba(34, 211, 238, 0.26), inset 0 0 34px rgba(34, 211, 238, 0.12);
    --e-5: 0 0 48px rgba(34, 211, 238, 0.32), inset 0 0 44px rgba(34, 211, 238, 0.14);
    --shadow-soft: var(--e-4);
    --tech-grid: rgba(34, 211, 238, 0.14);
    --tech-glow-a: rgba(34, 211, 238, 0.42);
    --tech-glow-b: rgba(255, 43, 214, 0.34);
    --tech-ink-glow: 0 0 10px rgba(34, 211, 238, 0.55);
    --tech-veil:
      radial-gradient(90% 70% at 12% 6%, rgba(34, 211, 238, 0.10), transparent 60%),
      linear-gradient(160deg, #0a1220, #060a12 58%, #04070d);
  }

  /* ---------- ⑥ 温润拟物：纸感 + 暖棕 + 衬线字 + 柔和立体 ---------- */
  [data-theme="light"][data-style="warm"] {
    --paper: #fffdf7; --paper-solid: #fffdf7;
    --paper-edge: #e7dbc4; --paper-hi: rgba(255, 255, 255, 0.75);
    --ink: #4a3f33; --ink-soft: #5b4a36; --ink-faint: #9a8467;
    --accent: #b5602f; --accent-strong: #b5602f;
    --accent-soft: rgba(181, 96, 47, 0.14); --accent-ink: #8a4517;
    --accent-line: rgba(181, 96, 47, 0.44); --accent-glow: rgba(181, 96, 47, 0.28);
    --weekend: #b3402f; --holiday-fg: #b3402f; --cinnabar: #b3402f;
    --workday: #4e7a46; --focus-amber: #c9824c;
    --r-lg: 14px; --blur-card: 0px;
    --dur-fast: 160ms; --dur-normal: 240ms; --dur-slow: 360ms;
    --font-sans: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
    --e-4: inset 0 1px 0 #fff, 0 1px 0 #fff, 0 16px 32px rgba(120, 90, 50, 0.22),
          0 3px 7px rgba(120, 90, 50, 0.14);
    --e-5: inset 0 1px 0 #fff, 0 26px 56px rgba(120, 90, 50, 0.28);
    --shadow-soft: var(--e-4);
    /* v3.1.0：纸感——细纤维斜纹 + 暖羊皮纸渐变 */
    --warm-veil:
      repeating-linear-gradient(45deg, rgba(120, 90, 50, 0.045) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, #fffdf7, #faf1e0 55%, #f6ecda);
  }
  [data-theme="dark"][data-style="warm"] {
    --paper: #2c2419; --paper-solid: #241c12;
    --paper-edge: #4a3f2c; --paper-hi: rgba(255, 255, 255, 0.05);
    --ink: #efe4d2; --ink-soft: #c6b79a; --ink-faint: #9a8a6e;
    --accent: #d98a55; --accent-strong: #d98a55;
    --accent-soft: rgba(217, 138, 85, 0.18); --accent-ink: #f0b27a;
    --accent-line: rgba(217, 138, 85, 0.46); --accent-glow: rgba(217, 138, 85, 0.30);
    --weekend: #e07264; --holiday-fg: #e07264; --cinnabar: #e07264;
    --workday: #8fb06a; --focus-amber: #e0a060;
    --r-lg: 14px; --blur-card: 0px;
    --dur-fast: 160ms; --dur-normal: 240ms; --dur-slow: 360ms;
    --font-sans: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
    --e-4: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 18px 38px rgba(0, 0, 0, 0.50);
    --e-5: 0 30px 64px rgba(0, 0, 0, 0.58);
    --shadow-soft: var(--e-4);
    --warm-veil:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.018) 0 2px, transparent 2px 6px),
      linear-gradient(150deg, #2e2618, #241c12 58%, #1e170e);
  }

  /* ==========================================================================
   * v3.1.0 §3 六风格视觉重做 · 装饰层（仅在原生模式下；选了自选背景时让位给皮肤层）
   * --------------------------------------------------------------------------
   * tech  → 赛博朋克：青/品红双霓虹光晕 + 网格底 + 四角切角(clip-path) + 文字微发光
   * glass → 磨砂玻璃：页面自绘彩色光斑 + 半透明卡面 + 斜向高光带（C10：不靠 blur 糊桌面）
   * neu   → 新拟态：外壳双向阴影由 token 的 --e-4/--e-5 承载；内嵌控件/日期格见本段末尾
   * warm  → 纸感：细纤维斜纹 + 暖羊皮纸渐变（--warm-veil）
   * default/minimal：只调层级/圆角，保持中性克制
   *
   * 用 :not([data-skin]) 限定：用户选「纯色/图片」皮肤时，背景由皮肤层
   * （[data-skin="color|image"] #widget）接管，风格只保留材质变量，避免抢背景。
   * 选择器 html[data-style="X"]:not([data-skin]) #widget 特异度 (1,2,1)，恒压过基础 #widget(1,0,0)。
   * ========================================================================== */
  html[data-style="tech"]:not([data-skin]) #widget {
    background:
      repeating-linear-gradient(0deg, var(--tech-grid) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, var(--tech-grid) 0 1px, transparent 1px 22px),
      radial-gradient(130% 90% at 100% 0%, var(--tech-glow-a) 0%, transparent 56%),
      radial-gradient(130% 90% at 0% 100%, var(--tech-glow-b) 0%, transparent 58%),
      var(--tech-veil);
    border: 1px solid var(--paper-edge);
    clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px),
                       calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px);
  }
  /* 赛博朋克：主文字加霓虹微发光（状态色不加，保持色相守恒） */
  html[data-style="tech"]:not([data-skin]) #clkTime,
  html[data-style="tech"]:not([data-skin]) #infoDate,
  html[data-style="tech"]:not([data-skin]) #infoLunar,
  html[data-style="tech"]:not([data-skin]) #weekHeader .wcell,
  html[data-style="tech"]:not([data-skin]) .sel,
  html[data-style="tech"]:not([data-skin]) .today-btn,
  html[data-style="tech"]:not([data-skin]) #dayCount {
    text-shadow: var(--tech-ink-glow);
  }

  html[data-style="glass"]:not([data-skin]) #widget {
    background:
      linear-gradient(145deg, var(--glass-sheen-a), var(--glass-sheen-b)),
      var(--glass-veil);
    border: 1px solid var(--glass-edge);
  }
  /* 磨砂玻璃：一条边界可辨的斜向光泽带（有峰值 .58 有回落，不是均匀提亮）—— 用户点名要「光泽亮化」 */
  html[data-style="glass"]:not([data-skin]) #widget::after {
    content: ''; position: absolute; inset: 0; z-index: 2; border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(115deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.58) 16%,
      rgba(255, 255, 255, 0.10) 34%,
      rgba(255, 255, 255, 0) 52%);
  }

  html[data-style="warm"]:not([data-skin]) #widget {
    background: var(--warm-veil);
    border: 1px solid var(--paper-edge);
  }

  /* 新拟态（缺陷2 灵魂）：把"凹/凸"语言做进内嵌控件与日期格，不再只有外壳是拟态。
   * 控件（工具栏按钮/下拉/星期切换/放大键）= 内凹(inset)；日期格常态=微凸，今日/选中=内凹。
   * 用 :not(:hover) 让常态保持微凸、hover 交回给共用 .cell:hover 的高亮环，兼顾拟态与可用性。 */
  html[data-style="neu"]:not([data-skin]) .nav-btn,
  html[data-style="neu"]:not([data-skin]) .today-btn,
  html[data-style="neu"]:not([data-skin]) .sel,
  html[data-style="neu"]:not([data-skin]) .wk-toggle,
  html[data-style="neu"]:not([data-skin]) .zoom-btn {
    box-shadow: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
  }
  html[data-style="neu"]:not([data-skin]) .cell:not(:hover) {
    box-shadow: 2px 2px 4px var(--neu-dark), -2px -2px 4px var(--neu-light);
  }
  html[data-style="neu"]:not([data-skin]) .cell.today,
  html[data-style="neu"]:not([data-skin]) .cell.selected {
    box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
  }
  /* 键盘可达性：focus 描边压过上面的拟态阴影 */
  html[data-style="neu"]:not([data-skin]) .cell:focus-visible {
    box-shadow: inset 0 0 0 2px var(--accent-line);
  }

  /* ==========================================================================
   * v3.0.0 §3.2 文字轴 data-text（只覆盖「文字相关」变量，绝不碰纸面/强调/状态色）
   * --------------------------------------------------------------------------
   * light = 深字（浅底语义）、dark = 浅字；auto/缺失 → 不设属性，跟随 [data-theme]。
   * 选择器用 :root[...]（特异性 (0,2,0)）并置于全部 [data-style] 之后，
   * 与 [data-theme][data-style] 同权靠源序取胜 → 文字轴恒压过风格档。
   * 仅定义 5 个文字变量：--ink / --ink-soft / --ink-faint / --stroke-color / --ink-glow。
   * （--stroke-color/--ink-glow 在 skin 生效时由 app.js applyClarity 内联写入覆盖，此处为原生底兜底）
   * ========================================================================== */
  :root[data-text="light"] {
    --ink: #1f2430; --ink-soft: #4b5563; --ink-faint: #9aa1ad;
    --stroke-color: rgba(255, 255, 255, 0.70);
    --ink-glow: 0 0 0 transparent;
  }
  :root[data-text="dark"] {
    --ink: #e8eaf0; --ink-soft: #9aa3b3; --ink-faint: #6a7283;
    --stroke-color: rgba(0, 0, 0, 0.55);
    --ink-glow: 0 0 0 transparent;
  }

  /* ========== v2.4.0 第二轮 皮肤背景层（纯色 / 图片） ==========
   * 皮肤层只改背景层，文字明暗由 data-theme 全量驱动，
   * 状态色（今日蓝/节假日红/选中绿）仍取生效主题 token。
   * 纯色 → #widget 铺 --skin-bg-solid；图片 → #widget 透明，由 #skinImg 层铺图。
   *
   * v3.0.0 修四角黑边：body 透明确保透明窗圆角外不露底色。但
   * [data-theme="dark"] body（源序更后、特异性同为 (0,1,1)）会反压本条，
   * 深色主题 + 皮肤时圆角外露主题深底 → 四角黑边。
   * 故皮肤层 body 规则加 html 前缀把特异性提到 (0,1,2)，恒压过主题层 body 底色 */
  html[data-skin="color"] body, html[data-skin="image"] body { background: transparent; }

  /* ========== X1：原生皮肤下 Electron 的 body 透明 ==========
   * 根因：皮肤层只补了 [data-skin] 两态（上一条），**原生皮肤一直没补**。
   * 未选皮肤时 body 取基础渐变底（见下方 body 规则）或 [data-theme="dark"] body 深底，
   * 而窗口本身是「透明 + 圆角」的 —— 圆角之外就会露出这块底色（四角漏底 / 深色主题发黑）。
   * 为什么加 html 前缀：html body.electron 特异性 (0,1,2)，恒压过
   *   [data-theme="dark"] body 的 (0,1,1)，与上一条同为皮肤层恒压主题层的同一手法；
   *   源序放在本条之后，即使与 (0,1,2) 的同权规则（[data-skin] 两态）相遇也只是都写 transparent。
   * 为什么用 .electron 而不是裸 body：该 class 只在 Electron 下由 app.js 打在 body 上，
   *   浏览器预览（无 window.api）不命中 → 预览页仍保留那层渐变底做衬底。
   * 注意：#widget 自己照样铺主题/皮肤底色，所以「窗口透明」不等于「日历变透明」，
   *   这里只去掉圆角外那圈底色。 */
  html body.electron { background: transparent; }
  [data-skin="color"] #widget { background: var(--skin-bg-solid); }
  [data-skin="image"] #widget { background: transparent; }

  /* ========== v3.4.0 第三轮：媒体层空白时给主窗垫底衬（修「日历界面 MP4 会变透明」）==========
   * 缺陷：图片/动图模式下 #widget 背景是 transparent（上一条），而媒体层只有成功铺图 / 起播后才有内容 ——
   *   媒体失败 / 未就绪时整窗「什么都看不到」= 透明。浮窗 / 桌面插件自带不透明卡面（dock.html 的 --card），
   *   故只有主窗表现为透明。
   * 修法：媒体层当前空白时（app.js 维护 data-media-blank='1'），把 #widget 垫成中性纸面 var(--paper)。
   *   为什么用 --paper：它是全主题已定义的中性纸面 token（native 态 #widget 的同一来源）⇒ 不引入新颜色口径。
   *   为什么用属性门而**不改**上一条：媒体正常时该属性为 '0'，上一条逐字生效 ⇒ 观感零变化、既有闸门不受影响。
   * 特异度：html[data-skin="image"][data-media-blank="1"] #widget = (1,2,1) > (1,1,0)，恒压过上一条。 */
  html[data-skin="image"][data-media-blank="1"] #widget { background: var(--paper); }

  /* ========== v2.4.4 自选纯色/图片皮肤：三层可读性（保护遮罩 + 文字光晕 + 兜底描边） ==========
   * 用户反馈：自选图片背景局部明暗不均，白字在亮部被冲掉、黑字在暗部看不清。
   * 第 1 层自动明暗在主进程（分区采样+迟滞）；这里落第 2/3 层，全部由 clarity(0~100) 联动，
   * 变量由 app.js applyClarity 按文字明暗写入。原生白天/黑夜/跟随系统皮肤无 [data-skin]，不触发。 */

  /* 第 3 层-a：文字保留极细兜底描边（随 clarity 变淡，不再是重描边压字） */
  [data-skin="color"] #clkTime, [data-skin="image"] #clkTime,
  [data-skin="color"] #infoDate, [data-skin="image"] #infoDate,
  [data-skin="color"] #infoLunar, [data-skin="image"] #infoLunar,
  [data-skin="color"] .sel, [data-skin="image"] .sel,
  [data-skin="color"] .nav-btn, [data-skin="image"] .nav-btn,
  [data-skin="color"] .today-btn, [data-skin="image"] .today-btn,
  [data-skin="color"] .wk-label, [data-skin="image"] .wk-label,
  [data-skin="color"] .wk-opt, [data-skin="image"] .wk-opt,
  [data-skin="color"] .zoom-btn, [data-skin="image"] .zoom-btn,
  [data-skin="color"] #weekHeader .wcell, [data-skin="image"] #weekHeader .wcell,
  [data-skin="color"] .cell .d, [data-skin="image"] .cell .d,
  [data-skin="color"] .cell .sub, [data-skin="image"] .cell .sub {
    -webkit-text-stroke: 0.5px var(--stroke-color);
    text-shadow: var(--ink-glow);
  }

  /* 第 2 层：局部背景保护遮罩（顶部信息栏 / 日历网格 / 底部工具栏），浓度随 clarity 变强 */
  [data-skin="color"] #infoBar, [data-skin="image"] #infoBar {
    background: linear-gradient(180deg, var(--protect-top), transparent 92%);
  }
  [data-skin="color"] #calendar::before, [data-skin="image"] #calendar::before {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: var(--protect-mid); pointer-events: none;
  }
  /* html 前缀提升特异性：压过 [data-theme="dark"] #dragBar（同为 (1,1,0)，靠源序会输） */
  html[data-skin="color"] #dragBar, html[data-skin="image"] #dragBar {
    background: var(--protect-bot);
  }

  /* 第 3 层-b：状态元素轻微保护晕环（不破坏原状态底色，只加外环+柔光） */
  [data-skin="color"] .cell.today:not(.other)::after,
  [data-skin="image"] .cell.today:not(.other)::after,
  [data-skin="color"] .cell.holiday::after,   [data-skin="image"] .cell.holiday::after,
  [data-skin="color"] .cell.selected:not(.other)::after,
  [data-skin="image"] .cell.selected:not(.other)::after,
  [data-skin="color"] .cell.range::after,     [data-skin="image"] .cell.range::after,
  [data-skin="color"] .cell.reminder::after,  [data-skin="image"] .cell.reminder::after {
    content: ''; position: absolute; inset: -1px; border-radius: inherit;
    box-shadow: 0 0 0 2px var(--protect-state), 0 1px 6px var(--protect-state);
    pointer-events: none;
  }

  /* ============================ L3 组件层 ============================ */

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    color: var(--ink);
    background: linear-gradient(135deg, #eef1f6, #f4f1fb 55%, #f0ebf7);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: var(--s-6);
    transition: background var(--dur-slow) var(--ease-in-out);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  [data-theme="dark"] body {
    background: linear-gradient(135deg, #14161f, #1a1c28 55%, #191725);
  }

  /* ===== 外层 widget：340×430（保持 0.79 比例与 max 等比放大） ===== */
  #widget {
    position: relative; z-index: 0; display: flex; flex-direction: column;
    width: 340px; height: 430px;
    border-radius: var(--r-lg);
    background: var(--paper);
    -webkit-backdrop-filter: blur(var(--blur-card)) saturate(1.4);
    backdrop-filter: blur(var(--blur-card)) saturate(1.4);
    border: 1px solid var(--paper-edge);
    box-shadow: var(--e-4);
    overflow: hidden;
    transition: background var(--dur-slow) var(--ease-in-out),
                border-color var(--dur-slow) var(--ease-in-out),
                box-shadow var(--dur-slow) var(--ease-in-out),
                border-radius var(--dur-normal) var(--ease-out);
  }
  #widget.max { border-radius: var(--r-xl); box-shadow: var(--e-5); }

  /* ===== v2.4.0 第二轮 图片皮肤背景层 =====
   * 绝对定位铺满 #widget，z-index:-1 使其画在 #widget 背景之上、正文之下
   * （#widget 由 backdrop-filter 形成 stacking context，负 z-index 子元素落入其内部第 2 层）。
   * background-image/size/position 由 app.js applySkinImage 按 crop+zoom 换算写入。 */
  #skinImg {
    position: absolute; inset: 0; z-index: -1;
    background-repeat: no-repeat;
    background-color: transparent;
    pointer-events: none;
  }
  /* v3.4.0 MP4 动图层：<div> 装不下视频，MP4 改用一个独立的 <video> 元素承载。
   * 为什么必须有一层 wrapper（#skinVidWrap）：视频要按取景结果被摆成**比卡片更大**的盒子
   *（见 app.js layoutSkin 的 VIDEO 分支），必须有人在它外部裁剪；若让视频自己溢出，
   * 本应用窗口是**透明**的，溢出的画面会直接画在用户桌面上。
   * border-radius: inherit 跟随卡片圆角，否则四角会露出视频的直角。 */
  #skinVidWrap {
    position: absolute; inset: 0; z-index: -1;
    overflow: hidden;              /* 裁剪必须在自己身上：#widget 并没有 overflow:hidden */
    border-radius: inherit;        /* 跟随卡片圆角，否则四角露出视频直角 */
    pointer-events: none;
  }
  #skinVid { position: absolute; object-fit: cover; }

  /* ===== 信息条（时钟 + 日期 + 农历） ===== */
  #infoBar {
    flex: 0 0 62px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--s-3) 0 var(--s-3);
    background: linear-gradient(180deg, var(--paper-hi), rgba(0, 0, 0, 0));
    border-bottom: 1px solid var(--paper-edge);
    transition: background var(--dur-slow) var(--ease-in-out);
    /* v2.4.0 A5：放大界面顶部时间栏可拖动（内部仅时钟/日期文本，无按钮，无需 no-drag） */
    -webkit-app-region: drag;
    user-select: none;
  }
  #clkTime {
    font-size: var(--fs-6xl); font-weight: var(--fw-semibold);
    color: var(--ink); letter-spacing: 0.5px; line-height: 1;
    font-variant-numeric: tabular-nums;
    font-feature-settings: var(--font-num-feat);
  }
  .info-right { display: flex; flex-direction: column; align-items: flex-end; gap: var(--s-1); }
  #infoDate { font-size: var(--fs-md); font-weight: var(--fw-bold); color: var(--ink); line-height: 1; letter-spacing: 0.3px; }
  #infoLunar { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--ink-soft); line-height: 1; letter-spacing: 0.2px; }

  /* ===== 功能栏（年/月 + 箭头 + 今 + 周起始 + 主题 + 放大） ===== */
  #dragBar {
    flex: 0 0 38px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--s-2) 0 var(--s-3);
    /* v2.3.2 用户反馈改灰：工具栏底色由蓝改中性灰（ink 系 12%），与暖纸卡协调不抢眼，
     * 底边线保持 16% 灰黑分界。 */
    background: rgba(31, 35, 48, 0.12);
    border-bottom: 1px solid rgba(31, 35, 48, 0.16);
    cursor: move; user-select: none;
    -webkit-app-region: drag;
    transition: background var(--dur-slow) var(--ease-in-out);
  }
  [data-theme="dark"] #dragBar { background: rgba(255, 255, 255, 0.045); }
  #dragBar .sel, #dragBar .nav-btn, #dragBar .today-btn,
  #dragBar .bar-right, #dragBar .bar-right * { -webkit-app-region: no-drag; }
  /* v2.2.0 需求4：桌面插件模式下禁用原生拖拽（改由 IPC 绝对定位 + 工作区夹取），
   * 否则 -webkit-app-region:drag 会抢走 mousedown，导致自定义拖动 + 边界夹取失效。 */
  body.desktop-mode #dragBar { -webkit-app-region: no-drag; }
  .toolbar { display: flex; align-items: center; gap: var(--s-1); flex: 1; }
  .ym-select { display: flex; align-items: center; gap: var(--s-1); }

  /* 下拉选择：统一控件语言（白底 / 描边 / 自定义三角） */
  .sel {
    height: 20px; padding: 0 15px 0 var(--s-1);
    border: 1px solid var(--ctl-edge); border-radius: var(--r-sm);
    background-color: var(--ctl-bg); color: var(--ink);
    font-family: inherit; font-size: var(--fs-sm); font-weight: var(--fw-semibold);
    cursor: pointer; outline: none; appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%),
                      linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
    background-position: calc(100% - 9px) 7px, calc(100% - 6px) 7px;
    background-size: 3px 3px, 3px 3px; background-repeat: no-repeat;
    transition: border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                background-color var(--dur-fast) var(--ease-out);
  }
  .sel:hover { border-color: var(--accent-line); }
  .sel:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
  .sel.s-y { width: 52px; }
  .sel.s-m { width: 38px; }

  /* 图标按钮（上一月 / 下一月） */
  .nav-btn {
    width: 20px; height: 20px; border: 1px solid var(--ctl-edge); border-radius: var(--r-sm);
    cursor: pointer;
    background-color: var(--ctl-bg); color: var(--ink);
    font-size: var(--fs-sm); line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background-color var(--dur-fast) var(--ease-out),
                transform var(--dur-instant) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out);
  }
  .nav-btn:hover { background-color: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
  .nav-btn:active { transform: scale(0.90); }

  /* 主按钮（回到今天） */
  .today-btn {
    height: 20px; min-width: 22px; padding: 0 var(--s-1); border: none; border-radius: var(--r-sm);
    cursor: pointer;
    background: var(--accent); color: #fff;
    font-family: inherit; font-weight: var(--fw-semibold); font-size: var(--fs-2xs);
    box-shadow: 0 2px 7px var(--accent-glow);
    transition: transform var(--dur-instant) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                filter var(--dur-fast) var(--ease-out);
  }
  .today-btn:hover { filter: brightness(1.06); box-shadow: 0 4px 12px var(--accent-glow); }
  .today-btn:active { transform: scale(0.94); }

  /* 周起始 toggle（轨道 + 滑块） */
  .wk-switch { display: flex; align-items: center; gap: 5px; height: 20px; cursor: pointer; user-select: none; }
  .wk-label { font-size: var(--fs-2xs); color: var(--ink-soft); white-space: nowrap; }
  .wk-toggle {
    position: relative; width: 44px; height: 20px; border-radius: var(--r-pill);
    background: var(--ctl-bg-hover); border: 1px solid var(--ctl-edge);
    display: flex; align-items: center;
  }
  .wk-opt {
    position: absolute; top: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-2xs); font-weight: var(--fw-bold); color: var(--ink-faint); z-index: 1;
    transition: color var(--dur-fast) var(--ease-out);
  }
  .wk-opt-l { left: var(--s-2); }
  .wk-opt-r { right: var(--s-2); }
  .wk-knob {
    position: absolute; top: 1px; left: 1px;
    width: 20px; height: 16px; border-radius: var(--r-pill);
    background: var(--ctl-bg); box-shadow: var(--e-1);
    transition: left var(--dur-normal) var(--ease-spring);
  }
  .wk-switch.mon .wk-knob { left: 1px; }
  .wk-switch.mon .wk-opt-l { color: var(--accent); }
  .wk-switch.sun .wk-knob { left: 23px; }
  .wk-switch.sun .wk-opt-r { color: var(--accent); }

  .bar-right { display: flex; align-items: center; gap: var(--s-2); margin-left: auto; }

  /* 图标按钮（主题 / 关注列表 / 放大） */
  .zoom-btn {
    width: 22px; height: 22px; border: none; border-radius: var(--r-sm); cursor: pointer;
    background-color: var(--ctl-bg-hover); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    transition: background-color var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out),
                transform var(--dur-instant) var(--ease-out);
  }
  .zoom-btn:hover { background-color: var(--accent-soft); color: var(--accent-ink); }
  .zoom-btn:active { transform: scale(0.92); }
  .zoom-btn.active { background-color: var(--accent-soft); color: var(--accent-ink); }
  .zoom-btn svg { display: block; }

  /* v3.0.0 §5 D：主窗换肤键移除 —— 主窗/放大态恒隐藏（.bar-right 为 flex，自动靠拢无缺口）；
   * 桌面插件把同一节点复用为「锁定键」，故仅 body.desktop-mode 显示，绝不误伤桌面锁。 */
  #themeBtn { display: none; }
  body.desktop-mode #themeBtn { display: flex; }

  /* v2.3.2 需求3：放大镜内符号随状态切换 —— mini 显示「+」（点击放大）、放大态显示「-」（点击缩小） */
  .zoom-sign-minus { display: none; }
  #widget.max .zoom-sign-minus { display: block; }
  #widget.max .zoom-sign-plus { display: none; }

  /* ========== v2.4.3 自选纯色/图片皮肤：功能栏按钮玻璃化调淡 ==========
   * 对齐 v4 预览 .fn-btn：玻璃底 rgba(255,255,255,0.10)（原 0.16）、
   * 描边 rgba(255,255,255,0.16)（原 0.22），hover 提亮。仅自选皮肤生效；
   * 原生皮肤仍用设计系统 --ctl-* token。「今」today-btn 保持主色实底，突出主操作。 */
  [data-skin="color"] #dragBar .sel, [data-skin="image"] #dragBar .sel,
  [data-skin="color"] #dragBar .nav-btn, [data-skin="image"] #dragBar .nav-btn,
  [data-skin="color"] #dragBar .zoom-btn, [data-skin="image"] #dragBar .zoom-btn {
    background-color: rgba(255, 255, 255, 0.10);
    border-color: rgba(255, 255, 255, 0.16);
  }
  [data-skin="color"] #dragBar .sel:hover, [data-skin="image"] #dragBar .sel:hover,
  [data-skin="color"] #dragBar .nav-btn:hover, [data-skin="image"] #dragBar .nav-btn:hover,
  [data-skin="color"] #dragBar .zoom-btn:hover, [data-skin="image"] #dragBar .zoom-btn:hover {
    background-color: rgba(255, 255, 255, 0.22);
    border-color: rgba(255, 255, 255, 0.35);
  }

  /* ===== 日历主体 ===== */
  #body { flex: 1; display: flex; padding: var(--s-2) var(--s-2) var(--s-2) var(--s-2); min-height: 0; overflow: hidden; }
  #calendar { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; }

  /* 背景大号月份数字（水印） */
  #bgMonth {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; font-size: 200px; font-weight: 800; line-height: 1;
    color: var(--watermark); pointer-events: none; z-index: 0;
    user-select: none; font-variant-numeric: tabular-nums;
    letter-spacing: -6px;
  }

  #litGlow { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: transparent; transition: background var(--dur-fast) var(--ease-out); }

  #weekHeader { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: var(--s-1); position: relative; z-index: 2; }
  #weekHeader .wcell {
    text-align: center; font-size: var(--fs-3xs); color: var(--ink-faint);
    padding: var(--s-1) 0; letter-spacing: 2px; font-weight: var(--fw-semibold);
  }
  #weekHeader .wcell.weekend { color: var(--weekend); }

  #grid {
    display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr);
    gap: 2px; flex: 1; min-height: 0; position: relative; z-index: 2; overflow: hidden;
  }

  /* 单元格：透明底，让水印透出；状态色由下方规则叠加 */
  .cell {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: var(--r-sm); cursor: pointer;
    background: transparent;
    border: 1px solid transparent; padding: 3px 2px;
    transition: background var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out);
  }
  [data-theme="dark"] .cell { background: rgba(255, 255, 255, 0.045); }
  .cell:hover {
    background: var(--cell-hover);
    box-shadow: inset 0 0 0 1px var(--cell-hover-line);
    transform: translateY(-1px);
  }
  .cell:active { transform: translateY(0) scale(0.97); }
  .cell:focus { outline: none; }
  .cell:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-line); }
  .cell .d {
    font-size: var(--fs-lg); font-weight: var(--fw-bold); color: var(--ink);
    line-height: 1; letter-spacing: -0.3px;
    font-variant-numeric: tabular-nums; font-feature-settings: var(--font-num-feat);
  }
  .cell .sub {
    font-size: var(--fs-3xs); font-weight: var(--fw-medium); color: var(--ink-soft);
    margin-top: 2px; line-height: 1; letter-spacing: 0.1px;
  }
  .cell:where(:not(.today)) .sub.sub-festival { color: var(--workday); font-weight: var(--fw-semibold); }

  .cell.other { opacity: 0.40; }
  .cell.other .d, .cell.other .sub { color: var(--ink-faint); }
  .cell.other.holiday { opacity: 0.65; }
  /* 跨月区间选中的 other 格提高透明度，否则浅绿被 opacity 压得不可见 */
  .cell.other.range, .cell.other.range-between { opacity: 0.6; }
  /* v3.1.0 返工(缺陷)：深色档「上下月日期」双重减淡 → 近乎不可见。
   * 本档 --ink-faint 已承担「次级文字」语义（tech/glass 深档还自带 alpha，如 .42/.52），
   * 再乘 .cell.other 的 .40 会二次衰减（tech: .42 × .40 ≈ 17% 有效 alpha）→ 深底上等于没画。
   * 故深色档改用较轻的额外衰减；.holiday / .range 按同比例上调，避免制造新的不一致。
   * 浅色档（上方 4 行）一行不动——浅档实测可辨，动了反而回归。 */
  [data-theme="dark"] .cell.other { opacity: 0.80; }
  [data-theme="dark"] .cell.other.holiday { opacity: 0.92; }
  [data-theme="dark"] .cell.other.range,
  [data-theme="dark"] .cell.other.range-between { opacity: 0.88; }

  /* v3.4.0【用户反馈修复·缺陷#5】今日格日期数字被「周末红」反压 → 恒白字失守。
   * 事实：今天恰逢周六，`.cell.weekend:not(.other):not(.workday):not(.holiday) .d` 是 6 个类 (0,6,0)，
   *   压过今日白字的 `.cell.today:not(.other) .d` (0,4,0) ⇒ 今日格里的数字（如「12」）显示成红色。
   * 修法：给下方每一条「状态色」规则加今日守卫 `:where(:not(.today))`，使其不再命中今日格，
   *   今日格的颜色遂由 today 规则独占（(0,4,0)、源序更后）。今日的 `.d` 与 `.sub` 在所有档位恒白。
   * 为什么用 :where() 而不是裸 :not()：:not() 会给选择器**加 1 个类的特异性**，使被改规则**变强**、
   *   可能新赢过它原先输给的规则。反例：`.cell .sub.sub-festival` (0,3,0) 与
   *   `.cell.other .d/.sub` (0,3,0) 同权、靠源序后者胜（其它月份的节日格显示 --ink-faint）；
   *   若改成 `.cell:not(.today) .sub.sub-festival` 变 (0,4,0) 就会**反超** ⇒ 非今日格行为被改。
   *   `:where()` 的特异性贡献为 0 ⇒ 改后特异性与改前**逐位相同**，非今日格「零行为变化」可证明。
   *   Electron 31 = Chromium 126，`:where()` 自 Chromium 88 起原生支持，安全。
   *
   * 改前/改后特异性对照（(a,b,c) 三元组；行号为改动前行号；11 条改动逐条相同）：
   *   :986  .cell .sub.sub-festival                                    (0,3,0) → (0,3,0)
   *   :1003 .cell.weekend:not(.other):not(.workday):not(.holiday) .d    (0,6,0) → (0,6,0)
   *   :1004 .cell.weekend:not(.other) .sub                             (0,4,0) → (0,4,0)
   *   :1011 .cell.selected:not(.other) .d                              (0,4,0) → (0,4,0)
   *   :1045 .cell.range .d                                            (0,3,0) → (0,3,0)
   *   :1048 .cell.range-between .d                                     (0,3,0) → (0,3,0)
   *   :1059 .cell.reminder .d                                          (0,3,0) → (0,3,0)
   *   :1072 .cell.holiday .d                                           (0,3,0) → (0,3,0)
   *   :1073 .cell.holiday .sub                                         (0,3,0) → (0,3,0)
   *   :1076 .cell.workday .d                                           (0,3,0) → (0,3,0)
   *   :1077 .cell.workday .sub                                         (0,3,0) → (0,3,0)
   *   全部 11 条改动后特异性一位不变（与上表左列完全一致）。 */
  .cell.weekend:not(.other):not(.workday):not(.holiday):where(:not(.today)) .d { color: var(--weekend); }
  .cell.weekend:not(.other):where(:not(.today)) .sub { color: var(--weekend); }

  /* 选中态 */
  .cell.selected:not(.other) {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1.5px var(--accent-line);
  }
  .cell.selected:not(.other):where(:not(.today)) .d { color: var(--accent-ink); }

  /* 今日：实心主色 + 白字 + 外发光，一眼可辨。
   * 放在 selected 之后且特异性不低于它 —— 今日与选中同时出现时今日始终胜出。 */
  .cell.today:not(.other) {
    background: linear-gradient(180deg, var(--accent-strong), var(--accent-strong));
    box-shadow: inset 0 0 0 1.5px var(--accent-strong), 0 2px 10px var(--accent-glow);
  }
  .cell.today:not(.other) .d,
  .cell.today:not(.other) .sub { color: #fff; }

  /* v3.4.0【用户反馈修复】今日格：由**不透明**实心强调色（linear-gradient 同色 = 纯色块）+ 白字，
   * 改为「半透明强调色 + 主题色内描边 + 顶部内高光 + 1px 外光圈」——
   *   ① 自选图片/动图档（html[data-skin="image"]，含视频）：照片能从背后透出来，不再糊成「一坨纯色」；
   *   ② 原生皮肤档（html:not([data-skin])）：用户要求「今日再透明一点点 + 加一点光影，更突出今天，
   *      又不影响周边单元格、不严重影响背景图」⇒ 与 image 档**同款**（见下方紧随的规则）。
   * 纯色档 [data-skin="color"] **逐字不动**（用户明确「仅限原生皮肤 + 自选图片」）—— 两选择器天然不命中它。
   * 不透明度取自变量区 --today-fill-alpha（现默认 68%），不在此写死，便于切档验收。
   * 为什么加 html 前缀：本选择器主体 `.cell.today:not(.other)` 是 3 个类 → 特异性 (0,3,0)；
   *   前置 `html[data-skin="image"]` / `html:not([data-skin])` 后 = 1 元素 + 3 类 + 1 属性 → (0,4,1)，
   *   恒压过后序/同权的主题规则 —— 本项目曾因只靠源序取胜失败，出过「圆角缺口漏底 / 四角黑边」。
   * 为什么用 color-mix 而不是写死 rgba：--accent-strong 随「风格 × 明暗」变化（默认蓝 / 极简近黑 /
   *   玻璃紫…），写死会锁死某一风格；color-mix 对任意强调色统一取该 alpha（Electron 31 = Chromium 126 原生支持）。
   * 光影为何用 inset + 1px 外光圈：外发光会溅到相邻格 —— 旧规则 `0 2px 10px` 外溢约 12px，正是用户
   *   「不要影响周边单元格」所指；现改为纯 inset（零外溢）+ 1px/0-blur 外光圈（外溢 ≤1px，落在 2px 格间距内）。
   * 日期数字对比度不降：今日 .d/.sub 仍为白字，且 [data-skin] 下本就有描边 + 光晕兜底（见上文第 3 层-a）。 */
  html[data-skin="image"] .cell.today:not(.other) {
    background: color-mix(in srgb, var(--accent-strong) var(--today-fill-alpha, 68%), transparent);
    box-shadow:
      inset 0 0 0 1.5px var(--accent-strong),   /* 主题色内描边：定界 */
      inset 0 1px 0 rgba(255, 255, 255, 0.30),  /* 顶部内高光：纸感光泽 */
      0 0 0 1px var(--accent-glow);             /* 1px 外光圈（0 blur，落在 2px 格间距内） */
  }

  /* v3.4.0【用户反馈修复 · 续】把「半透明填充 + 光影」扩展到「原生皮肤」（与 image 档同款）：
   * 用户原话：「今日的单元格的颜色再透明一点点，加一点点光影特效之类的，能更突出今天，又不会影响
   *   周边单元格，也不会严重影响背景图片，这个设置仅限于原生皮肤默认和自选图片模式」。
   * 特异性：html(1 元素) + :not([data-skin])(1 属性) + .cell+.today+:not(.other)(3 类) = (0,4,1)，恒压过基条 (0,3,0)。
   * ⚠️ 纯色档 [data-skin="color"] 逐字不动 —— html:not([data-skin]) 天然不命中它（故 color 档仍走上面那条不透明实心块）。 */
  html:not([data-skin]) .cell.today:not(.other) {
    background: color-mix(in srgb, var(--accent-strong) var(--today-fill-alpha, 68%), transparent);
    box-shadow:
      inset 0 0 0 1.5px var(--accent-strong),
      inset 0 1px 0 rgba(255, 255, 255, 0.30),
      0 0 0 1px var(--accent-glow);
  }
  /* neu（新拟态）材质档保留其拟态内阴影 —— 本版今日格规则不应抹掉材质身份；本选择器 (0,5,1) > (0,4,1) ⇒ 本档胜出。 */
  html[data-style="neu"]:not([data-skin]) .cell.today:not(.other) {
    box-shadow:
      inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light),
      inset 0 0 0 1.5px var(--accent-strong);
  }

  /* 日期区间：端点深、中间浅，形成连续的浅绿带 */
  .cell.range {
    background: var(--range-soft);
    box-shadow: inset 0 0 0 1.5px var(--range-line);
  }
  .cell.range:where(:not(.today)) .d { color: var(--range-ink); }
  .cell.range:hover { background: rgba(34, 197, 94, 0.28); }
  .cell.range-between { background: var(--range-softer); border-radius: 3px; }
  .cell.range-between:where(:not(.today)) .d { color: var(--range-ink); }
  .cell.range-between:hover { background: rgba(34, 197, 94, 0.26); }
  [data-theme="dark"] .cell.range:hover { background: rgba(34, 197, 94, 0.34); }
  [data-theme="dark"] .cell.range-between:hover { background: rgba(34, 197, 94, 0.28); }

  /* 特别关注：琥珀底 + 橙描边 + 角标「关」 */
  .cell.reminder {
    background: var(--focus-soft);
    box-shadow: inset 0 0 0 1.5px var(--focus-line);
  }
  .cell.reminder:hover { background: rgba(245, 158, 11, 0.30); }
  .cell.reminder:where(:not(.today)) .d { color: var(--focus-ink); }
  .chip-focus {
    position: absolute; top: 3px; left: 3px;
    min-width: 11px; height: 11px; padding: 0 2px;
    border-radius: var(--r-xs); background: var(--focus-amber); color: #fff;
    font-size: var(--fs-3xs); font-weight: var(--fw-bold);
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  [data-theme="dark"] .chip-focus { background: var(--focus-amber); color: var(--ink-900); }

  /* 节假日 */
  .cell.holiday { background: var(--cinnabar-soft); box-shadow: inset 0 0 0 1.5px var(--cinnabar-line); }
  .cell.holiday:where(:not(.today)) .d { color: var(--holiday-fg); }
  .cell.holiday:where(:not(.today)) .sub { color: var(--holiday-fg); margin-top: var(--s-1); opacity: 0.9; }

  /* 调休上班日 */
  .cell.workday:where(:not(.today)) .d { color: var(--workday); }
  .cell.workday:where(:not(.today)) .sub { color: var(--workday); opacity: 0.85; }

  .chip {
    position: absolute; top: 3px; right: 3px; min-width: 11px; height: 11px; padding: 0 2px;
    border-radius: var(--r-xs); color: #fff; font-size: var(--fs-3xs); font-weight: var(--fw-bold);
    display: inline-flex; align-items: center; justify-content: center; line-height: 1;
  }
  .chip-rest { background: var(--cinnabar); }
  .chip-work { background: var(--workday); }

  /* ===== 单元格右键 → 定时关注输入栏 ===== */
  #remindInput {
    position: absolute; z-index: 40;
    display: flex;                      /* 由 opacity/visibility 控制显隐，保留过渡 */
    flex-direction: column; gap: var(--s-1);
    padding: var(--s-2) var(--s-2) 7px;
    width: 200px;
    background: var(--paper-solid);
    -webkit-backdrop-filter: blur(var(--blur-pop));
    backdrop-filter: blur(var(--blur-pop));
    border: 1px solid var(--paper-edge);
    border-radius: var(--r-md);
    box-shadow: var(--e-3);
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateY(-4px) scale(0.98);
    transform-origin: top center;
    transition: opacity var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-out),
                visibility var(--dur-fast) var(--ease-out);
  }
  #remindInput.show {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translateY(0) scale(1);
  }
  #remindInput .label { font-size: var(--fs-xs); color: var(--ink-soft); }
  #remindInput .label strong { color: var(--accent-ink); margin: 0 2px; font-weight: var(--fw-semibold); }
  #remindInput .hint { font-size: var(--fs-2xs); color: var(--ink-faint); }
  #remindInput input {
    height: 24px; padding: 0 var(--s-2);
    border: 1px solid var(--ctl-edge);
    border-radius: var(--r-sm);
    background: var(--ctl-bg); color: var(--ink);
    font-family: inherit; font-size: var(--fs-sm); outline: none;
    transition: border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out);
  }
  #remindInput input::placeholder { color: var(--ink-faint); }
  #remindInput input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
  /* ===== v3.0.0 定时（时:分）行：留空=全天；两栏都填才生效 ===== */
  #remindInput .time-row { display: flex; align-items: center; gap: 4px; }
  #remindInput .time-row .time-label { font-size: var(--fs-xs); color: var(--ink-soft); }
  #remindInput .time-row .time-colon { color: var(--ink-faint); }
  #remindInput .time-row input { width: 38px; text-align: center; padding: 0 var(--s-1); flex: 0 0 auto; }
  /* ===== v3.1.0 C5：定时提示行（内容输入框下方）—— 实时反映「定时提醒：H时M分」/「全天提醒」 ===== */
  #remindTimeHint { font-size: var(--fs-2xs); color: var(--ink-faint); letter-spacing: 0.02em; }
  #remindTimeHint.has-time { color: var(--accent-ink); font-weight: var(--fw-semibold); }
  /* 隐藏 number 输入框的上下微调箭头（Chromium） */
  #remindInput .time-row input::-webkit-outer-spin-button,
  #remindInput .time-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #remindInput .actions { display: flex; gap: var(--s-1); justify-content: flex-end; }
  #remindInput button {
    border: none; border-radius: var(--r-sm); padding: 0 var(--s-3); height: 24px;
    font-family: inherit; font-size: var(--fs-2xs); font-weight: var(--fw-semibold);
    cursor: pointer;
    transition: background-color var(--dur-fast) var(--ease-out),
                transform var(--dur-instant) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                filter var(--dur-fast) var(--ease-out);
  }
  #remindInput .btn-cancel { background: var(--ctl-bg-hover); color: var(--ink); }
  #remindInput .btn-cancel:hover { background-color: rgba(31, 35, 48, 0.11); }
  [data-theme="dark"] #remindInput .btn-cancel:hover { background-color: rgba(255, 255, 255, 0.16); }
  #remindInput .btn-ok {
    background: var(--accent); color: #fff;
    box-shadow: 0 2px 7px var(--accent-glow);
  }
  #remindInput .btn-ok:hover { filter: brightness(1.06); box-shadow: 0 4px 12px var(--accent-glow); }
  #remindInput button:active { transform: scale(0.96); }

  /* ===== 轻量提示条 ===== */
  #toast {
    position: absolute; z-index: 70;
    left: 50%; bottom: var(--s-4);
    transform: translateX(-50%) translateY(8px);
    padding: 7px var(--s-3); border-radius: var(--r-sm);
    background: var(--scrim); color: var(--ink-25);
    font-size: var(--fs-sm); font-weight: var(--fw-semibold); white-space: nowrap;
    box-shadow: var(--e-3);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur-fast) var(--ease-out),
                transform var(--dur-normal) var(--ease-out);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  [data-theme="dark"] #toast { color: var(--ink-900); }
  #widget.max #toast { bottom: 30px; padding: var(--s-3) var(--s-6); font-size: var(--fs-4xl); border-radius: var(--r-md); }

  /* ===== 天数浮层 ===== */
  #dayCount {
    position: absolute; z-index: 30; pointer-events: none;
    transform: translate(-50%, -50%);
    padding: 6px var(--s-2) 6px var(--s-2); border-radius: 9px;
    background: var(--green-600); color: #fff;
    font-size: var(--fs-sm); font-weight: var(--fw-bold); white-space: nowrap;
    box-shadow: 0 8px 22px rgba(22, 128, 61, 0.45);
    opacity: 0; visibility: hidden;
    transition: opacity var(--dur-fast) var(--ease-out),
                visibility var(--dur-fast) var(--ease-out);
    display: block;
  }
  #dayCount.show { opacity: 1; visibility: visible; }
  #dayCount::after {
    content: ''; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: var(--green-600); border-bottom: 0;
  }

  /* ==========================================================================
   * 放大模式（expanded）：340×430 → 760×959（约 2.24x）等比重画，
   * 布局节奏、字号、间距全量重设，让"放大"看起来图也变大而不只是图床变大。
   * ========================================================================== */

  /* 尺寸策略：
     - Electron：窗口内容区即 340×430（mini）或 760×959（expanded），
       body 必须去内边距 + 取消居中（避免裁切卡片边缘），
       widget 精确填满窗口（透明窗露出圆角=桌面穿透）。
     - 浏览器预览：维持 padding+居中，让卡片在视口内浮起 gutter，
       阴影/圆角不被裁。 */
  body.electron { padding: 0; display: block; }
  body.electron #widget {
    width: 100%; height: 100%;
    border-radius: var(--r-lg);   /* 透明窗口的圆角=卡片圆角，桌面从四角透出 */
  }
  /* v2.2.0 需求2：放大模式内容按 760×961 设计尺寸固定，再用 zoom 随窗口物理宽等比缩放，
   * 修掉"窗口缩小但内容固定字号不变、被裁切显示不全"的问题。zoom 由主进程下发
   * --uizoom（= 窗口宽 / 760）驱动；mini 模式无 .max，不受 zoom 影响。 */
  body.electron #widget.max {
    width: 760px; height: 961px;
    border-radius: var(--r-xl);
    zoom: var(--uizoom, 1);
  }
  body:not(.electron) #widget.max {
    width: min(760px, calc(100vw - 48px), calc((100vh - 48px) * 0.7907));
    aspect-ratio: 340 / 430;
    height: auto;
  }

  #widget.max {
    border-radius: var(--r-xl);
    box-shadow: var(--e-5);
    border-width: 1.5px;
  }
  #widget.max #infoBar {
    flex: 0 0 96px;
    padding: 0 28px;
  }
  #widget.max #clkTime { font-size: var(--fs-8xl); letter-spacing: 1.5px; line-height: 1; }
  #widget.max .info-right { gap: var(--s-2); }
  #widget.max #infoDate { font-size: var(--fs-5xl); letter-spacing: 0.5px; }
  #widget.max #infoLunar { font-size: var(--fs-4xl); }

  #widget.max #dragBar {
    flex: 0 0 64px;
    padding: 0 var(--s-6) 0 28px;
  }
  #widget.max .sel { height: 34px; font-size: var(--fs-xl); padding: 0 26px 0 var(--s-3); border-radius: 9px; }
  #widget.max .sel.s-y { width: 92px; }
  #widget.max .sel.s-m { width: 62px; }
  #widget.max .sel { background-position: calc(100% - 16px) 12px, calc(100% - 12px) 12px; background-size: 5px 5px, 5px 5px; }
  #widget.max .nav-btn { width: 34px; height: 34px; font-size: var(--fs-4xl); border-radius: 9px; }
